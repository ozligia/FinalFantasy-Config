[include mainsail_local.cfg]
[include klipper_extra_hardware.cfg]
[include klipper_bed_mesh_adjust.cfg]
[include klipper_toolheads.cfg]
[include klipper_common.cfg]
[include klipper_filament_management.cfg]
[include klipper_toolchanger.cfg]
[include klipper_gcode_overrides.cfg]
[include klipper_homing_scripts.cfg]
[include klipper_print_scripts.cfg]
[include klipper_endstop_drift.cfg]
[include timelapse_local.cfg]

#########################################################
# Stepper configs
#########################################################

[stepper_x]
enable_pin: !PF14
step_pin: PF13
dir_pin: !PF12
microsteps: 8
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 1:1
#endstop_pin: PG6
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: -8
position_endstop: -8
position_max: 309.00
homing_speed: 25
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: true
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PG6
driver_SGT: 1
# Updated with Gemini
driver_TBL: 1                  # Narrows the blanking window to prevent the driver from going blind to tiny 0.8A pulses
driver_TOFF: 4                 # Slows down the chopper frequency slightly to stabilize the low-current wave
driver_HSTRT: 0                # Drops the hysteresis ceiling to stop high-pitched motor buzzing
driver_HEND: 2  

[stepper_y]
enable_pin: !PF15
step_pin: PG0
dir_pin: !PG1
microsteps: 8
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 1:1
endstop_pin: PG9
#endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -81
position_endstop: 249.00
position_max: 250.0
homing_speed: 75
homing_retract_dist: 5
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: true
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0
# Updated with Gemini
driver_TBL: 1                  # Narrows the blanking window to prevent the driver from going blind to tiny 0.8A pulses
driver_TOFF: 4                 # Slows down the chopper frequency slightly to stabilize the low-current wave
driver_HSTRT: 0                # Drops the hysteresis ceiling to stop high-pitched motor buzzing
driver_HEND: 2  


[stepper_z]
enable_pin: !PG5
step_pin: PF11
dir_pin: PG3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 8
gear_ratio: 1:1
endstop_pin: PG10
position_min: -5
position_endstop: 397.300
position_max: 405.00
homing_speed: 50
second_homing_speed: 2
homing_retract_dist: 5
homing_positive_dir: false

[tmc5160 stepper_z]
cs_pin: PC6
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
interpolate: false
run_current: 0.850
sense_resistor: 0.075
stealthchop_threshold: 0
# Updated with Gemini
driver_TBL: 1                  # Narrows blanking time to catch tiny 0.8A current pulses
driver_TOFF: 4                 # Slows chopper frequency down to stabilize the 48V wave
driver_HSTRT: 0                # Eliminates high-pitched motor "singing" while holding position
driver_HEND: 2                 # Dampens mid-frequency magnetic vibrations

[thermistor calibrated_bed]
# Point 1: Verified at room temp
temperature1: 20.5
resistance1: 125000

# Point 2: Verified perfect at 50°C
temperature2: 50.0
resistance2: 34000

# Point 3: Adjusted to fix the 85.7°C vs 90°C gap
# Decreased from 8800 to 8000
temperature3: 90.0
resistance3: 7850

[heater_bed]
heater_pin: PB11 # Heat0 connector
sensor_pin: PF3 # T0 heatbed thermistor
sensor_type: calibrated_bed
#control: pid
min_temp: 0
max_temp: 150

#########################################################
# Generic printer options
#########################################################

[mcu]
canbus_uuid: f92a67943e15

[printer]
kinematics: corexy
max_velocity: 500.0
max_accel: 16000.0
minimum_cruise_ratio: 0.3
square_corner_velocity: 16.0
max_z_velocity: 100
max_z_accel: 3000

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 79.8
shaper_type_y: mzv
shaper_freq_y: 71.4

[respond]
default_type: echo
default_prefix: MACHINE:

[exclude_object]

[skew_correction]

[save_variables]
filename: ~//printer_data/config/klipper_saved_variables.cfg

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
  SET_PIN PIN=case_light VALUE=0
  {% if printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes %}
    G90
    SET_GCODE_OFFSET Z=0.0
    G0 Z{printer.configfile.settings.stepper_z.position_max} F12000
  {% endif %}
  TURN_OFF_HEATERS
  M18
  M107 ALL
timeout: 600

