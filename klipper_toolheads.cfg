[mcu ebb_toolhead_0]
canbus_uuid: 174060ce0d34

[temperature_sensor EBB_toolhead_0_board_temp]
sensor_type: temperature_mcu
sensor_mcu: ebb_toolhead_0

[resonance_tester]
# Required default chip for Klipper config loading. Resonance macros select the
# mounted tool accelerometer at runtime with CHIPS="lis2dw toolN".
accel_chip: lis2dw tool0
probe_points: 150,150,20
min_freq: 5
max_freq:133
accel_per_hz: 75
hz_per_sec:1

[extruder]
sensor_type: MAX31865
sensor_pin: ebb_toolhead_0:gpio17
spi_bus: spi0_gpio4_gpio3_gpio2
step_pin: ebb_toolhead_0:gpio7
dir_pin: ebb_toolhead_0:gpio6
enable_pin: !ebb_toolhead_0:gpio14
rotation_distance: 4.637
gear_ratio: 1:1
microsteps:16
full_steps_per_rotation: 200  
nozzle_diameter: 0.8
filament_diameter: 1.75
heater_pin:ebb_toolhead_0:gpio23
min_temp: -200
max_temp: 320
max_power: 1.0
min_extrude_temp: 170
#pressure_advance: 0.007            # Flow 94%
#pressure_advance: 0.025            # Flow 100% - values where no gaps under microscope
pressure_advance: 0.045             # Flow 100% - visually good corner
pressure_advance_smooth_time: 0.015 # less time - less distance affected by pressure_advance
control = pid
pid_kp = 13.826
pid_ki = 0.904
pid_kd = 52.883

[tmc2209 extruder]
uart_pin:ebb_toolhead_0:gpio15
interpolate:False
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 0
# Updated with Gemini
driver_TBL: 1                       # Narrows blanking time to keep current readings crisp
driver_TOFF: 3                      # Sets standard constant off-time cycle for stable 24V operation
driver_HSTRT: 3                     # Lowers the current overshoot to kill high-pitched hissing
driver_HEND: 3                      # Expands the hysteresis bottom to eliminate mid-frequency drone

[verify_heater extruder]
max_error: 120
check_gain_time:120
hysteresis: 25
heating_gain: 2

[fan_generic part_cooling_fan_toolhead_0]
pin:ebb_toolhead_0:gpio21
kick_start_time: 0.5
off_below: 0.09

[heater_fan hotend_fan_tool_0]
pin: ebb_toolhead_0:gpio13
heater: extruder
heater_temp: 40.0

[lis2dw tool0]
spi_speed: 400000
cs_pin: ebb_toolhead_0:gpio12
spi_bus: spi0_gpio4_gpio3_gpio2

# Toolhead 1 (EBB1, extruder1, fans, accelerometer) is disabled due to a heater fault.
# T1 dock geometry is retained in klipper_toolchanger.cfg for safe recovery.

[gcode_macro _SHAPER_CALIBRATE]
description: Internal shaper calibration helper; selects accelerometer from the mounted print tool.
gcode:
  {% set tool = printer.save_variables.variables.last_mounted_tool_index|default(-1)|int %}
  {% set chip = "lis2dw tool"~tool %}
  {% if "CHIPS" in params %}
    { action_raise_error("CHIPS is selected from the mounted tool; remove CHIPS from _SHAPER_CALIBRATE") }
  {% elif chip in printer.configfile.settings %}
    SHAPER_CALIBRATE CHIPS="{chip}" {rawparams}
  {% else %}
    { action_raise_error("_SHAPER_CALIBRATE requires a mounted tool with lis2dw toolN accelerometer; saved tool is T%d" % tool) }
  {% endif %}

[gcode_macro _TEST_RESONANCES]
description: Internal resonance test helper; selects accelerometer from the mounted print tool.
gcode:
  {% set tool = printer.save_variables.variables.last_mounted_tool_index|default(-1)|int %}
  {% set chip = "lis2dw tool"~tool %}
  {% if "CHIPS" in params %}
    { action_raise_error("CHIPS is selected from the mounted tool; remove CHIPS from _TEST_RESONANCES") }
  {% elif chip in printer.configfile.settings %}
    TEST_RESONANCES CHIPS="{chip}" {rawparams}
  {% else %}
    { action_raise_error("_TEST_RESONANCES requires a mounted tool with lis2dw toolN accelerometer; saved tool is T%d" % tool) }
  {% endif %}

[gcode_macro RESONANCE_TEST]
description: Open resonance test UI and select a tool with an accelerometer
gcode:
  {% set tool_indexes = [] %}
  {% for heater in printer.heaters.available_heaters %}
    {% if heater.startswith("extruder") %}
      {% set suffix = heater|replace("extruder","") %}
      {% set tool_index = 0 if suffix == "" else suffix|int %}
      {% set chip = "lis2dw tool"~tool_index %}
      {% if chip in printer.configfile.settings and "gcode_macro T"~tool_index in printer %}
        {% set _ = tool_indexes.append(tool_index) %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% set tool_indexes = tool_indexes|sort %}
  {% if tool_indexes|length == 0 %}
    { action_raise_error("No defined extruder tools with lis2dw toolN accelerometers found") }
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_begin Resonance test"
  RESPOND TYPE=command MSG="action:prompt_text Select which tool accelerometer to use for the resonance test."
  RESPOND TYPE=command MSG="action:prompt_text The next screen lets you choose full XY input-shaper calibration or a single-axis resonance test."
  RESPOND TYPE=command MSG="action:prompt_text The selected run will home if needed, mount the selected tool, and intentionally vibrate the toolhead."
  RESPOND TYPE=command MSG="action:prompt_text Do not start this while printing, touching the printer, or with anything loose on the bed."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for tool_index in tool_indexes %}
    RESPOND TYPE=command MSG="action:prompt_button T{tool_index}|_RESONANCE_TEST_SELECT_TOOL TOOL={tool_index}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _RESONANCE_TEST_SELECT_TOOL]
description: Internal resonance test UI step; select test type for one tool
gcode:
  {% if "TOOL" not in params %}
    { action_raise_error("TOOL parameter is not specified") }
  {% endif %}
  {% set tool = params.TOOL|int %}
  {% set chip = "lis2dw tool"~tool %}
  {% if "gcode_macro T"~tool not in printer %}
    { action_raise_error("T%d macro is not defined" % tool) }
  {% endif %}
  {% if chip not in printer.configfile.settings %}
    { action_raise_error("T%d has no %s accelerometer configured" % (tool, chip)) }
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_begin Resonance test T{tool}"
  RESPOND TYPE=command MSG="action:prompt_text Accelerometer: {chip}"
  RESPOND TYPE=command MSG="action:prompt_text Calibrate XY will run Klipper input-shaper calibration on X and Y using T{tool}."
  RESPOND TYPE=command MSG="action:prompt_text Test X and Test Y run a single-axis resonance measurement for diagnosis."
  RESPOND TYPE=command MSG="action:prompt_text The selected test will home if needed, mount T{tool}, then vibrate the toolhead."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Calibrate XY|_RESONANCE_TEST_RUN TOOL={tool} MODE=SHAPER|primary"
  RESPOND TYPE=command MSG="action:prompt_button Test X|_RESONANCE_TEST_RUN TOOL={tool} MODE=TEST AXIS=X|primary"
  RESPOND TYPE=command MSG="action:prompt_button Test Y|_RESONANCE_TEST_RUN TOOL={tool} MODE=TEST AXIS=Y|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|RESONANCE_TEST|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _RESONANCE_TEST_RUN]
description: Internal resonance test runner; mounts selected tool then runs selected test
gcode:
  {% if "TOOL" not in params %}
    { action_raise_error("TOOL parameter is not specified") }
  {% endif %}
  {% set tool = params.TOOL|int %}
  {% set mode = params.MODE|default("SHAPER")|upper %}
  {% set chip = "lis2dw tool"~tool %}
  {% if printer.print_stats.state|lower == "printing" %}
    { action_raise_error("Resonance testing is blocked while printing") }
  {% endif %}
  {% if "gcode_macro T"~tool not in printer %}
    { action_raise_error("T%d macro is not defined" % tool) }
  {% endif %}
  {% if chip not in printer.configfile.settings %}
    { action_raise_error("T%d has no %s accelerometer configured" % (tool, chip)) }
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  T{tool}
  {% if mode == "SHAPER" %}
    _SHAPER_CALIBRATE
  {% elif mode == "TEST" %}
    {% set axis = params.AXIS|default("")|upper %}
    {% if axis not in ["X", "Y"] %}
      { action_raise_error("AXIS must be X or Y for resonance TEST mode") }
    {% endif %}
    _TEST_RESONANCES AXIS={axis}
  {% else %}
    { action_raise_error("MODE must be SHAPER or TEST") }
  {% endif %}
