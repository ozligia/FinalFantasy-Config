[gcode_macro M106]
gcode:
  {% set speed = params.S|default(255)|int / 255 %}
  {% if "FAN" in params and "P" in params %}
    { action_raise_error("M106 accepts either P or FAN, not both") }
  {% elif "FAN" in params %}
    {% set fan_name = params.FAN %}
    {% if "fan_generic "~fan_name in printer.configfile.settings %}
      SET_FAN_SPEED FAN={fan_name} SPEED={speed}
    {% else %}
      { action_raise_error("M106 unknown FAN=%s; use a configured fan_generic name" % fan_name) }
    {% endif %}
  {% elif "P" in params %}
    {% set p = params.P|int %}
    {% if p == 2 and "fan_generic aux_fan" in printer.configfile.settings %}
      SET_FAN_SPEED FAN=aux_fan SPEED={speed}
    {% elif p == 2 %}
      { action_raise_error("M106 unknown fan P2; aux_fan is not configured") }
    {% else %}
      { action_raise_error("M106 unknown fan P%d; use no P for active tool fan, P2 for aux_fan, or FAN=<configured fan_generic name>" % p) }
    {% endif %}
  {% else %}
    {% set current_tool = printer.save_variables.variables.last_mounted_tool_index|default(-1)|int %}
    {% set fan_name = "part_cooling_fan_toolhead_"~current_tool %}
    {% if current_tool >= 0 and "fan_generic "~fan_name in printer.configfile.settings %}
      SET_FAN_SPEED FAN={fan_name} SPEED={speed}
    {% else %}
      { action_raise_error("M106 active tool fan is not configured for T%d" % current_tool) }
    {% endif %}
  {% endif %}
    
[gcode_macro M107]
gcode:
  {% if 'all'|upper in params %}
    {% for section in printer.configfile.settings %}
      {% if section.startswith("fan_generic part_cooling_fan_toolhead_") %}
        SET_FAN_SPEED FAN={section|replace("fan_generic ", "")} SPEED=0
      {% endif %}
    {% endfor %}
    {% if "fan_generic aux_fan" in printer.configfile.settings %}
      SET_FAN_SPEED FAN=aux_fan SPEED=0
    {% endif %}
  {% elif "FAN" in params and "P" in params %}
    { action_raise_error("M107 accepts either P or FAN, not both") }
  {% elif "FAN" in params %}
    {% set fan_name = params.FAN %}
    {% if "fan_generic "~fan_name in printer.configfile.settings %}
      SET_FAN_SPEED FAN={fan_name} SPEED=0
    {% else %}
      { action_raise_error("M107 unknown FAN=%s; use a configured fan_generic name" % fan_name) }
    {% endif %}
  {% elif "P" in params %}
    {% set p = params.P|int %}
    {% if p == 2 and "fan_generic aux_fan" in printer.configfile.settings %}
      SET_FAN_SPEED FAN=aux_fan SPEED=0
    {% elif p == 2 %}
      { action_raise_error("M107 unknown fan P2; aux_fan is not configured") }
    {% else %}
      { action_raise_error("M107 unknown fan P%d; use no P for active tool fan, P2 for aux_fan, FAN=<configured fan_generic name>, or ALL" % p) }
    {% endif %}
  {% else %}
    {% set current_tool = printer.save_variables.variables.last_mounted_tool_index|default(-1)|int %}
    {% set fan_name = "part_cooling_fan_toolhead_"~current_tool %}
    {% if current_tool >= 0 and "fan_generic "~fan_name in printer.configfile.settings %}
      SET_FAN_SPEED FAN={fan_name} SPEED=0
    {% else %}
      { action_raise_error("M107 active tool fan is not configured for T%d" % current_tool) }
    {% endif %}
  {% endif %}
