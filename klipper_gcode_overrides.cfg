[gcode_macro M109] # Redefine M109 to control tolerance for waiting target temp
rename_existing: M99109
gcode:
  {% if 'S' in params%}
    {% set temp = params.S|float %}
    {% if 'T' in params %}
      {% set tool_index = params.T|string %}
      {% set extruder_name = ("extruder"~tool_index)|replace("0","") %}
      M104 S{temp} T{tool_index}
    {% else %}
      {% set extruder_name = printer.toolhead.extruder %}
      M104 S{temp}
    {% endif %}
    {% if temp > 0 %}
      M118 Waiting for temp {extruder_name}: {temp}
      SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={temp}
      TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={temp-2} MAXIMUM={temp+10}
    {% endif %}
  {% else %}
    { action_raise_error("There is no S parameter with target temp") }
  {% endif %}

[gcode_macro M140] 
rename_existing: M99140
gcode:
  {% if 'S' in params%}
    {% set temp = params.S|float %}
    {% if temp >= 0 %}
      {% if printer.print_stats.state|lower == "printing" %} #Check if new temp falls into allowed range
        {% set saved_max_temp = printer["gcode_macro _PRINT_STATE"].printbed_max_temp|float %}
        {% set saved_min_temp = printer["gcode_macro _PRINT_STATE"].printbed_min_temp|float %}
        {% set max_temp = [saved_max_temp, saved_min_temp]|max %}
        {% set min_temp = [saved_max_temp, saved_min_temp]|min %}
        {% if temp > max_temp %}
          {% set temp = max_temp %}
        {% endif %}
        {% if temp < min_temp %}
          {% set temp = min_temp %}
        {% endif %}
      {% endif %}
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={temp}
    {% endif %}
  {% else %}
    { action_raise_error("There is no S parameter with target temp") }
  {% endif %}

