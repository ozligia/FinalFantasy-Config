[gcode_macro _OPTICAL_ENDSTOP_DRIFT_REPORT_RESULT]
gcode:
	{% set temp = printer["temperature_sensor enclosure"].temperature|float %}
	{% set last_z_offset = printer.probe.last_z_result|float %}
	{% set seconds_since_start = printer.idle_timeout.printing_time %}
    {% set mode = params.MODE|default("repeatability") %}
	M118 Z endstop drift test: Mode: {mode} T: {temp} Z: {last_z_offset|round(5)} Timestamp: {seconds_since_start|round(3)}
    LOG MSG="Z endstop drift test: Mode: {mode} T: {temp} Z: {last_z_offset|round(5)} Timestamp: {seconds_since_start|round(3)}"
    
[gcode_macro OPTICAL_ENDSTOP_DRIFT_HEATUP_REHOME]
gcode:
  {% set step = 0.2|float %}
  {% set max_temp = 45.0|float %}
  {% set temp = printer["temperature_sensor enclosure"].temperature|float %}
  {% set steps = [] %}
  {% for i in range(1000) %}
    {% if temp + i * step <= max_temp %}
      {% set _ = steps.append((temp + i * step)|round(2)) %}
    {% endif %}
  {% endfor %}
  
  M140 S90
  
  M118 Optical endstop drift test: START
  LOG MSG="Optical endstop drift test: START"
  {% for i in steps %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor enclosure" MINIMUM={i}
    G28 Z
    PROBE
    M84
    _OPTICAL_ENDSTOP_DRIFT_REPORT_RESULT MODE="heatup_rehome"
  {% endfor %}
  TURN_OFF_HEATERS
  M118 Optical endstop drift test: STOP
  LOG MSG="Optical endstop drift test: STOP"

[gcode_macro OPTICAL_ENDSTOP_DRIFT_HEATUP]
gcode:
  {% set feedrate = 6000 %}
  {% set step = 0.2|float %}
  {% set max_temp = 45.0|float %}
  {% set temp = printer["temperature_sensor enclosure"].temperature|float %}
  {% set steps = [] %}
  {% for i in range(1000) %}
    {% if temp + i * step <= max_temp %}
      {% set _ = steps.append((temp + i * step)|round(2)) %}
    {% endif %}
  {% endfor %}
  
  G28 Z
  _PARK_HEATBED Z_FEEDRATE={feedrate}
  M140 S90
  
  M118 Optical endstop drift test: START
  LOG MSG="Optical endstop drift test: START"
  {% for i in steps %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor enclosure" MINIMUM={i}
    G0 Z20 F6000
    PROBE
    _OPTICAL_ENDSTOP_DRIFT_REPORT_RESULT MODE="heatup"
    _PARK_HEATBED Z_FEEDRATE={feedrate}
  {% endfor %}
  TURN_OFF_HEATERS
  M118 Optical endstop drift test: STOP
  LOG MSG="Optical endstop drift test: STOP"

[gcode_macro Z_ENDSTOP_REPEATABILITY]
gcode:
  LOG MSG="Z endstop repeatability start"
  {% set iter_count = 10 %}
  {% for i in range(iter_count) %}
    G28 Z
    PROBE
    _OPTICAL_ENDSTOP_DRIFT_REPORT_RESULT
    M18
    G4 P5000
  {% endfor %}
  LOG MSG="Z endstop repeatability end"
