[output_pin case_light]
pin: PD14 # Octopus FAN4+
pwm: False
value: 0             # off at startup
shutdown_value: 0    # stay off on MCU shutdown

[controller_fan motor_drivers]
pin: PD15 # Octopus FAN 5+
max_power:1.0
kick_start_time: 0.300
fan_speed: 1.0
idle_timeout: 120
idle_speed: 0.7
stepper: stepper_x,stepper_y,stepper_z,extruder

[multi_pin aux_fan_pins]
pins: PA2,PA3

[fan_generic aux_fan]
pin: multi_pin:aux_fan_pins
max_power:1.0
kick_start_time: 0.300
off_below: 0.1

#########################################################
# Probing. Tool measurement support
#########################################################
# [probe]
# pin: !PG11
# z_offset: 0.0
# speed: 3.0
# samples: 12
# samples_result: median
# samples_tolerance: 0.2

[gcode_macro MEASURE_TOOL_OFFSET]
gcode:
	{ action_respond_info("MEASURE_TOOL_OFFSET disabled: no probe installed") }
	
[gcode_macro APPLY_TOOL_OFFSET]
gcode:
	{ action_respond_info("APPLY_TOOL_OFFSET disabled: no probe installed") }
	
[gcode_macro MEASURE_TOOL]
gcode:
	{ action_respond_info("MEASURE_TOOL disabled: no probe installed") }

[temperature_sensor enclosure]
sensor_type: Generic 3950
sensor_pin: PF7

[gcode_macro LIGHT_TOGGLE]
description: Toggle case light on PD14
gcode:
  {% if printer["output_pin case_light"].value|float > 0.5 %}
    SET_PIN PIN=case_light VALUE=0
    {action_respond_info("Case lights: OFF")}
  {% else %}
    SET_PIN PIN=case_light VALUE=1
    {action_respond_info("Case lights: ON")}
  {% endif %}

[mcu btt_eddy_current_probe]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044505938B9591C-if00
restart_method: command

[temperature_sensor btt_eddy_current_probe_mcu]
sensor_type: temperature_mcu
sensor_mcu: btt_eddy_current_probe
min_temp: 10
max_temp: 100 

[probe_eddy_current btt_eddy_current_probe]
sensor_type: ldc1612
descend_z: 1.0
tap_threshold: 10000.0
i2c_mcu: btt_eddy_current_probe
i2c_bus: i2c0f
x_offset: 0
y_offset: -12.48

[temperature_probe btt_eddy_current_probe]
sensor_type: Generic 3950
sensor_pin: btt_eddy_current_probe:gpio26
horizontal_move_z: 2
calibration_position: 154, 122, 15
calibration_bed_temp: 110
max_validation_temp: 110
