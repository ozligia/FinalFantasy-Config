#########################################################
# Print start\stop\cancel\pause\resume macroses 
#########################################################
[pause_resume]
recover_velocity = 60

[gcode_macro _PRINT_STATE]
variable_printbed_max_temp: 0
variable_printbed_min_temp: 0
variable_start_script_completed: 0
variable_tools_used: ""
variable_initial_tool_index: -1
variable_initial_tool_temp: 0.0
variable_tool_temp_0: 0.0
variable_tool_temp_1: 0.0
variable_tool_temp_2: 0.0
variable_tool_temp_3: 0.0
variable_tool_idle_temp_0: 0.0
variable_tool_idle_temp_1: 0.0
variable_tool_idle_temp_2: 0.0
variable_tool_idle_temp_3: 0.0
gcode:

[gcode_macro _RESET_PRINT_STATE]
description: Clear transient print state before a new job or after cancellation
gcode:
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=printbed_max_temp VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=printbed_min_temp VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=start_script_completed VALUE=0
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=tools_used VALUE='""'
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_index VALUE=-1
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_temp VALUE=0.0
  {% for i in range(4) %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~i} VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_idle_temp_"~i} VALUE=0.0
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=aux_fan_allowed VALUE=0

[gcode_macro START_PRINT]
# Start GCODE for Orca Slicer. It should go to machine start gcode in Orca Slicer as one line, without new lines
# START_PRINT FIRST_LAYER_HEIGHT={initial_layer_print_height} OOZE_PREVENTION_ENABLED={ooze_prevention} INITIAL_TOOL_INDEX=[initial_tool]
# INITIAL_TOOL_TEMP=[first_layer_temperature]{if is_extruder_used[0]} NOZZLE_DIAMETER0={nozzle_diameter[0]} TEMP0={nozzle_temperature_initial_layer[0]}
# IDLE_TEMP0={idle_temperature[0]} INITIAL_BED_TEMP0={bed_temperature_initial_layer[0]} BED_TEMP0={bed_temperature[0]} AUX_FAN0={additional_cooling_fan_speed[0]}{endif}
# {if is_extruder_used[1]} NOZZLE_DIAMETER1={nozzle_diameter[1]} TEMP1={nozzle_temperature_initial_layer[1]} IDLE_TEMP1={idle_temperature[1]}
# INITIAL_BED_TEMP1={bed_temperature_initial_layer[1]} BED_TEMP1={bed_temperature[1]} AUX_FAN1={additional_cooling_fan_speed[1]}{endif}{if is_extruder_used[2]}
# NOZZLE_DIAMETER2={nozzle_diameter[2]} TEMP2={nozzle_temperature_initial_layer[2]} IDLE_TEMP2={idle_temperature[2]} INITIAL_BED_TEMP2={bed_temperature_initial_layer[2]}
# BED_TEMP2={bed_temperature[2]} AUX_FAN2={additional_cooling_fan_speed[2]}{endif}{if is_extruder_used[3]} NOZZLE_DIAMETER3={nozzle_diameter[3]}
# TEMP3={nozzle_temperature_initial_layer[3]} IDLE_TEMP3={idle_temperature[3]} INITIAL_BED_TEMP3={bed_temperature_initial_layer[3]} BED_TEMP3={bed_temperature[3]}
# AUX_FAN3={additional_cooling_fan_speed[3]}{endif}

# USAGE: START_PRINT EXTRUDER_TEMP=<extruder_temp> BED_TEMP=<bed_temp> TOOL_INDEX=<tool_index>
variable_aux_fan_allowed: 0
    
gcode:
    # Variables
    {% set tools_count = 4 %}
    {% set tools_used = [] %}
    {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
    {% set xy_feedrate = printer.configfile.settings.printer.max_velocity * 60 / 2 %}
    {% set travel_speed = xy_feedrate %}
    
    # Variables for heatbed heat soak logic
    {% set soak_time = 120000 %} # 2 minutes in ms

    # Check START_PRINT gcode input parameters
    {% if not ("FIRST_LAYER_HEIGHT" in params and "OOZE_PREVENTION_ENABLED" in params) %}
      { action_raise_error("There is no FIRST_LAYER_HEIGHT or OOZE_PREVENTION_ENABLED in params!") }
    {% endif %}
    {% if not ("INITIAL_TOOL_INDEX" in params and "INITIAL_TOOL_TEMP" in params) %}
      { action_raise_error("There is no INITIAL_TOOL_INDEX or INITIAL_TOOL_TEMP in params!") }
    {% endif %}
    {% for i in range(tools_count) %}
      {% if "NOZZLE_DIAMETER"~i in params%}
        {% set _ = tools_used.append(i) %}
        {% if not ('TEMP'~i in params and 'IDLE_TEMP'~i in params and 'INITIAL_BED_TEMP'~i in params and 'BED_TEMP'~i in params and 'AUX_FAN'~i in params) %}
          { action_raise_error("For every extruder used there must be following variables: TEMP<N>, IDLE_TEMP<N>, INITIAL_BED_TEMP<N>, BED_TEMP<N> and AUX_FAN<n>" ) }
        {% endif %}
      {% endif %}
    {% endfor %}
    {% set INITIAL_TOOL_INDEX = params.INITIAL_TOOL_INDEX|int %}
    {% set INITIAL_TOOL_TEMP = params.INITIAL_TOOL_TEMP|float %}
    {% if not tools_used %}
      { action_raise_error("START_PRINT requires at least one configured tool via NOZZLE_DIAMETER<N>") }
    {% elif INITIAL_TOOL_INDEX < 0 or INITIAL_TOOL_INDEX >= tools_count %}
      { action_raise_error("INITIAL_TOOL_INDEX must be between 0 and 3") }
    {% elif INITIAL_TOOL_INDEX not in tools_used %}
      { action_raise_error("INITIAL_TOOL_INDEX must refer to a tool used in this print") }
    {% elif INITIAL_TOOL_TEMP <= 0 %}
      { action_raise_error("INITIAL_TOOL_TEMP must be greater than 0") }
    {% endif %}

    # Code section

    # Clear previous state/settings
    _RESET_PRINT_STATE
    SET_SKEW CLEAR=1   # Clear loaded skew profiles
    BED_MESH_CLEAR     # Clear loaded bed meshes 
    TURN_OFF_HEATERS   # Disable all heaters
    M107 ALL           # Disable all fans
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 # Reset all previous offsets
    G92 E0 # Reset current extruder steps
    
    # Initial configurations
	G90 ; Use absolute coordinates
	G21 ; Units in mm

    # If ooze_prevention enabled, only initial tool must be heated to
    # working temp. Other tool heaters must be heated to idle_temp
    {% set ooze_prevention_enabled = False %}
    {% if "OOZE_PREVENTION_ENABLED" in params %}
      {% if params.OOZE_PREVENTION_ENABLED|lower == "true" %}
        {% set ooze_prevention_enabled = True %}
      {% endif %}
    {% endif %}
    
    # As only one print table is avaialable, use highest temps for bed among all materials used in print
    {% set INITIAL_BED_TEMPS = [] %}{% for i in tools_used %}{% set _ = INITIAL_BED_TEMPS.append(params["INITIAL_BED_TEMP"~i]|float) %}{% endfor %}
    {% set INITIAL_BED_TEMP = INITIAL_BED_TEMPS|max %}
    {% set BED_TEMPS = [] %}{% for i in tools_used %}{% set _ = BED_TEMPS.append(params["BED_TEMP"~i]|float) %}{% endfor %}
    {% set BED_TEMP = BED_TEMPS|max %}
    {% set bed_min = [INITIAL_BED_TEMP, BED_TEMP]|min %}
    {% set bed_max = [INITIAL_BED_TEMP, BED_TEMP]|max %}
  
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=printbed_max_temp VALUE={bed_max}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=printbed_min_temp VALUE={bed_min}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=tools_used VALUE='"{tools_used|join(",")}"'
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_index VALUE={INITIAL_TOOL_INDEX}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_temp VALUE={INITIAL_TOOL_TEMP}
    {% for i in range(tools_count) %}
      {% if i in tools_used %}
        SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~i} VALUE={params["TEMP"~i]|float}
        SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_idle_temp_"~i} VALUE={params["IDLE_TEMP"~i]|float}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~i} VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_idle_temp_"~i} VALUE=0.0
      {% endif %}
    {% endfor %}
    
    {% set AUX_FAN_SPEEDS = [] %}{% for i in tools_used %}{% set _= AUX_FAN_SPEEDS.append(params["AUX_FAN"~i]|float) %}{% endfor %}

    # Check if usage of AUX_FAN is possible: only if AUX_FAN is enabled for all materials in print
    {% set aux_fan_allowed = False if AUX_FAN_SPEEDS|min == 0 else True %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=aux_fan_allowed VALUE={aux_fan_allowed}

    # Save variables that are used by other gcode_macroses
    {% for i in tools_used %}
      SAVE_VARIABLE VARIABLE={"last_used_nozzle_diameter"~i} VALUE={params["NOZZLE_DIAMETER"~i]}
      SAVE_VARIABLE VARIABLE={"last_used_nozzle_temp"~i} VALUE={params["TEMP"~i]}
    {% endfor %}
    
    # Start pre-heating of bed, max temp is used among all temps used in printing
    M118 Setting print table to {INITIAL_BED_TEMP}
    M140 S{INITIAL_BED_TEMP}
      
    #Perform homing sequence while heaters are prepared
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
        # Do not repeat homing sequence if all axis were homed already
        { action_respond_info("All axes are already homed, skipping G28") }
    {% else %}
        # Start homing sequence
        G28		
    {% endif %}

    # Skew profile and bed mesh must be loaded after homing
    # Load default skew profile
    {% set skew_profile_name = "default_skew_profile"%}
    M118 Loading skew profile: {skew_profile_name}
    SKEW_PROFILE LOAD={skew_profile_name}
    
    # Load bed mesh profile
    {% set bed_mesh_profile_name = "bed_mesh_temp_"~(((INITIAL_BED_TEMP + 5) // 10) * 10)|int|string %}
    M118 Loading bed mesh profile: {bed_mesh_profile_name}
    BED_MESH_PROFILE LOAD={bed_mesh_profile_name}

    # Change tool to one referenced with INITIAL_TOOL_INDEX
    # Always change, even if tool is already mounted, to apply
    # tool gcode_offset adjustments and heat expansion compensations
    T{INITIAL_TOOL_INDEX}

    # Move to start position at Xmax/2, Ymax
    G1 X{printer.configfile.settings.stepper_x.position_max/2} Y{printer.configfile.settings.stepper_y.position_max} F{xy_feedrate}
    G1 Z15 F{z_feedrate}

    # Wait for bed target temp
    M190 S{INITIAL_BED_TEMP}
    # Allow bed to soak heat during initial heating
    M118 Allow heatbed to soak heat for {soak_time / 1000}s...
    G4 P{soak_time} # Wait for heat to soak
    M118 Heatbed heat soak complete.

    # Start heating of all tools used in print, depending on ooze_prevention_enabled option
    # All tools can be set to idle_temp, but later initial tool is set to work_temp
    {% for i in tools_used %}
      {% if i == INITIAL_TOOL_INDEX %}
        # This is our active tool; set to the actual first layer temp
        M118 Setting initial tool {i} to work temp: {INITIAL_TOOL_TEMP}
        M104 S{INITIAL_TOOL_TEMP} T{i}
      {% elif ooze_prevention_enabled %}
        # This is a secondary tool; set to idle temp to prevent cooked plastic
        M118 Setting tool {i} to idle temp: {params["IDLE_TEMP"~i]|float}
        M104 S{params["IDLE_TEMP"~i]|float} T{i}
      {% else %}
        # No ooze prevention; heat secondary tools to full work temp immediately
        M118 Setting tool {i} to work temp: {params["TEMP"~i]|float}
        M104 S{params["TEMP"~i]|float} T{i}
      {% endif %}
    {% endfor %}

    # Wait for all used tools to reach target temperature
    M118 Waiting for all used tools to reach target temperature...
    {% for i in tools_used %}
      {% if i == INITIAL_TOOL_INDEX %}
        # Must wait for the full printing temp for the active tool
        M109 S{INITIAL_TOOL_TEMP} T{i}
      {% else %}
        # Wait for either idle or full temp for secondary tools
        {% set secondary_target = params["IDLE_TEMP"~i]|float if ooze_prevention_enabled else params["TEMP"~i]|float %}
        M109 S{secondary_target} T{i}
      {% endif %}
    {% endfor %}
    
    # Reapply thermal compensation after hotend targets are set/reached
    _APPLY_HEAT_EXPANSION_COMPENSATION
    
    # Unretract currently active tools
  _PRIME_NOZZLE

    # Clean nozzle of initial tool
    CLEAN_NOZZLE

    # Draw a purge line with initial tool
    DRAW_PURGE_LINE NOZZLE_DIAMETER={params["NOZZLE_DIAMETER"~INITIAL_TOOL_INDEX]} FIRST_LAYER_HEIGHT={params.FIRST_LAYER_HEIGHT}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  M118 Cancel print overridden
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}

  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  STOP_PRINT
  _RESET_PRINT_STATE
  {client.user_cancel_macro|default("")}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True if params.RESTORE|default(1)|int == 1 else False %}

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"

  {% if idle_timeout > 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}

  PAUSE_BASE
  {client.user_pause_macro|default("")}
  _PAUSE_PRINT_PARK {rawparams}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                  else printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}

  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}

  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %}
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}

  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _PAUSE_PRINT_PARK]
description: Park toolhead for a paused print
gcode:
  _CLIENT_RETRACT
  _STRING_BREAK_MOVE

  {% if "z" in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=_pause_print_park
    _PARK_HEATBED
    _PARK_HEAD
    RESTORE_GCODE_STATE NAME=_pause_print_park
  {% else %}
    RESPOND TYPE=echo MSG="Pause park skipped; Z not homed"
  {% endif %}

[gcode_macro _PARK_HEATBED]
description: Internal helper: park heatbed at safe Z maximum
gcode:
  {% set z_feedrate = params.Z_FEEDRATE|default(printer.configfile.settings.printer.max_z_velocity * 60 * 0.75)|float %}
  {% set margin = params.MARGIN|default(0.5)|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set origin_z = printer.gcode_move.homing_origin.z|float %}
  {% set z_limit = [max_z - origin_z - margin, max_z - margin]|min %}
  {% if "z" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_limit} F{z_feedrate}
  {% else %}
    RESPOND TYPE=echo MSG="Heatbed park skipped; Z not homed"
  {% endif %}

[gcode_macro _PARK_HEAD]
description: Internal helper: park toolhead at center rear
gcode:
  {% set xy_feedrate = params.XY_FEEDRATE|default(printer.configfile.settings.printer.max_velocity * 60 / 2)|float %}
  {% set park_x = params.X|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
  {% set park_y = params.Y|default(printer.toolhead.axis_maximum.y|float)|float %}
  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    G90
    G1 X{park_x} Y{park_y} F{xy_feedrate}
  {% else %}
    RESPOND TYPE=echo MSG="Toolhead park skipped; X/Y not homed"
  {% endif %}

[gcode_macro STOP_PRINT]
gcode:
  # Clear skew profile
  SET_SKEW CLEAR=1
  {% set print_state = printer["gcode_macro _PRINT_STATE"] %}
  {% set used_tools_raw = print_state.tools_used|string %}
  {% set used_tool_indexes = used_tools_raw.split(",") if used_tools_raw != "" else [] %}
  # Park active used hot filament first, then make a short wipe move before lifting away from the part
  {% set active_extruder = printer.toolhead.extruder %}
  {% if active_extruder != "" and active_extruder.startswith('extruder') %}
    {% set active_tool_index = active_extruder|replace("extruder","") %}
    {% set active_tool_index = "0" if active_tool_index == "" else active_tool_index %}
    {% set active_temp = printer[active_extruder].temperature|float %}
    {% set active_threshold = printer.configfile.settings[active_extruder].min_extrude_temp|float %}
    {% if active_tool_index in used_tool_indexes and active_temp > active_threshold %}
      _PARK_FILAMENT_TIP EXTRUDER={active_extruder}
      _STRING_BREAK_MOVE
    {% endif %}
  {% endif %}
  # Park other used hot filament tips before heaters are turned off
  {% for h in printer.heaters.available_heaters %}
    {% if h.startswith('extruder') and h != active_extruder %}
      {% set tool_index = h|replace("extruder","") %}
      {% set tool_index = "0" if tool_index == "" else tool_index %}
      {% set temp = printer[h].temperature|float %}
      {% set threshold = printer.configfile.settings[h].min_extrude_temp|float %}
      {% if tool_index in used_tool_indexes and temp > threshold %}
        _PARK_FILAMENT_TIP EXTRUDER={h}
      {% endif %}
    {% endif %}
  {% endfor %}
  # Turn off heaters
  TURN_OFF_HEATERS
  # Set AUX_FAN to cool all things off
  SET_FAN_SPEED FAN=aux_fan SPEED=1.0
  
  # Clear gcode offsets before final parking; park helpers use the resulting coordinate system.
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  _PARK_HEATBED
  _PARK_HEAD
  # Disable all fans
  M107 ALL
  SET_FAN_SPEED FAN=aux_fan SPEED=1.0 # Keep AUX_FAN working till IDLE_TIMEOUT
  # Disable all motors
  M18
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=tools_used VALUE='""'
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_index VALUE=-1
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_temp VALUE=0.0
  {% for i in range(4) %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~i} VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_idle_temp_"~i} VALUE=0.0
  {% endfor %}

[gcode_macro PAUSE_PRINT]
gcode:
    PAUSE {rawparams}
    M118 PRINTER PAUSED: {printer.pause_resume.is_paused}

[gcode_macro RESUME_PRINT]
gcode:
    RESUME {rawparams}
