#########################################################
# Homing configuration. Separate axis override
#########################################################
[gcode_macro _APPLY_HEAT_EXPANSION_COMPENSATION]
description: Internal helper: apply active hotend heat expansion Z compensation
gcode:
  {% set active_tool = printer.toolhead.extruder %}
  {% set thermal_expansion_factor = 0.000818 %}
  {% if active_tool != "" and active_tool in printer.heaters.available_heaters %}
    {% set active_tool_target_temp = printer[active_tool].target %}
    {% set threshold_temp = printer.configfile.settings[active_tool].min_extrude_temp|float %}
    {% if active_tool_target_temp > threshold_temp %}
      {% set nozzle_compensation = ((active_tool_target_temp - 30) * thermal_expansion_factor)|round(4) %}
      {% if printer.print_stats.state|lower == "printing" %}
        SET_GCODE_OFFSET Z_ADJUST={nozzle_compensation}
        M118 Applying active tool and bed heat expansion compensation on z axis: {nozzle_compensation|round(4)} mm
      {% else %}
        M118 Applying heat expansion compensation skipped because printer is not in printing state
        M118 Command would have applied compensation on z axis: {nozzle_compensation|round(4)} mm
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _APPLY_BASE_OFFSET]
description: Internal helper: apply saved machine base Z offset and clear XY offsets
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if "saved_z_offset_base" in svv %}
    {% set offset = svv.saved_z_offset_base|float %}
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z={offset}
    {% if offset > 0 %}
      M118 {"Applied base Z offset: %.3f mm; nozzle-bed gap increased by that value" | format(offset)}
    {% elif offset < 0 %}
      M118 {"Applied base Z offset: %.3f mm; nozzle-bed gap reduced by that value" | format(offset)}
    {% else %}
      M118 Applied base Z offset: 0.000 mm; nozzle-bed gap unchanged
    {% endif %}
  {% else %}
    { action_raise_error("saved_z_offset_base is not set; open Z_OFFSET_BASE and reset or adjust it") }
  {% endif %}

[gcode_macro Z_OFFSET_BASE]
description: Frontend for saved machine base Z offset
gcode:
  {% set current = printer.save_variables.variables.saved_z_offset_base|default(0.0)|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Base Z offset"
  RESPOND TYPE=command MSG="action:prompt_text Current saved_z_offset_base: {current|round(4)} mm"
  RESPOND TYPE=command MSG="action:prompt_text Adjust saved base offset. -offset reduces gap; +offset increases gap."
  RESPOND TYPE=command MSG="action:prompt_text Changes are saved and applied to future Z moves."
  {% for amount in [0.010, 0.050, 0.100] %}
    {% set label = "%.3f"|format(amount) %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Gap -{label}|SET_Z_OFFSET_BASE ADJUST=-{label}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Gap +{label}|SET_Z_OFFSET_BASE ADJUST={label}|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Reset offset to 0|SET_Z_OFFSET_BASE VALUE=0|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro SET_Z_OFFSET_BASE]
description: Set saved_z_offset_base with VALUE=<mm> or ADJUST=<mm>; no params opens frontend
gcode:
  {% set current = printer.save_variables.variables.saved_z_offset_base|default(0.0)|float %}
  {% if "VALUE" not in params and "ADJUST" not in params %}
    Z_OFFSET_BASE
  {% else %}
    {% if "VALUE" in params %}
      {% set value = (params.VALUE|float)|round(4) %}
    {% else %}
      {% set value = (current + (params.ADJUST|float))|round(4) %}
    {% endif %}
    {% set delta = value - current %}
    SAVE_VARIABLE VARIABLE=saved_z_offset_base VALUE={value}
    SET_GCODE_OFFSET Z_ADJUST={delta}
    M118 {"Saved base Z offset: %.4f mm" | format(value)}
    Z_OFFSET_BASE
  {% endif %}

[gcode_macro _APPLY_TOOL_OFFSETS]
description: Internal helper: apply saved base offset, selected tool offset, and heat expansion
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set index = params.INDEX|default(svv.last_mounted_tool_index)|int %}
  {% if "gcode_macro T"~index not in printer %}
    { action_raise_error("T%d macro is not defined" % index) }
  {% endif %}
  _APPLY_BASE_OFFSET
  {% set offset_params = printer["gcode_macro T"~index].nozzle_offset_adjustment|string %}
  SET_GCODE_OFFSET {offset_params}
  M118 Applied tool {index} position adjustments: {offset_params}
  {% set target_extruder = ("extruder"~index)|replace("0","") %}
  {% if target_extruder in printer.heaters.available_heaters %}
    _APPLY_HEAT_EXPANSION_COMPENSATION
  {% endif %}

[gcode_macro _APPLY_ACTIVE_TOOL_OFFSETS]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set tool_index = svv.last_mounted_tool_index|default(-1)|int %}
  {% if tool_index >= 0 %}
    {% set target_extruder = ("extruder"~tool_index)|replace("0","") %}
    {% if target_extruder in printer.heaters.available_heaters %}
      ACTIVATE_EXTRUDER EXTRUDER={target_extruder}
    {% endif %}
    _APPLY_TOOL_OFFSETS INDEX={tool_index}
  {% else %}
    _APPLY_BASE_OFFSET
  {% endif %}

[gcode_macro _SENSORLESS_HOME_X]
gcode:
  {% set previous_bed_mesh_profile = printer.bed_mesh.profile_name|default("") %}
  {% set saved_bed_mesh_profiles = printer.bed_mesh.profiles|default([]) %}
  {% set restore_bed_mesh_profile = previous_bed_mesh_profile if previous_bed_mesh_profile in saved_bed_mesh_profiles else "" %}
  G90
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  M118 Homing X
  {% if 'y'|upper in printer.toolhead.homed_axes|upper %}
    M118 Y Homed
    G0 Y50 F12000
  {% endif %}
  {% set HOME_CUR = 0.500 %}
  # Set current for sensorless homing
  _SET_TMC_DRIVER_XY_CURRENT CURRENT={HOME_CUR}
  # Pause to ensure driver stall flag is clear
  G4 P200
  # Home
  G28.999999 X
  # Set current for printing
  _SET_TMC_DRIVER_XY_CURRENT
  # Move away
  G91
  G1 X1 F1200
  G90
  {% if restore_bed_mesh_profile != "" %}
    BED_MESH_PROFILE LOAD={restore_bed_mesh_profile}
    M118 Restored bed mesh profile: {restore_bed_mesh_profile}
  {% elif previous_bed_mesh_profile != "" %}
    M118 Bed mesh profile {previous_bed_mesh_profile} was active before X homing but is not saved; not restoring
  {% endif %}
  M118 X axis homed

[gcode_macro _HOME_Y]
gcode:
  {% set previous_bed_mesh_profile = printer.bed_mesh.profile_name|default("") %}
  {% set saved_bed_mesh_profiles = printer.bed_mesh.profiles|default([]) %}
  {% set restore_bed_mesh_profile = previous_bed_mesh_profile if previous_bed_mesh_profile in saved_bed_mesh_profiles else "" %}
  G90
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  G28.999999 Y
  {% if restore_bed_mesh_profile != "" %}
    BED_MESH_PROFILE LOAD={restore_bed_mesh_profile}
    M118 Restored bed mesh profile: {restore_bed_mesh_profile}
  {% elif previous_bed_mesh_profile != "" %}
    M118 Bed mesh profile {previous_bed_mesh_profile} was active before Y homing but is not saved; not restoring
  {% endif %}
  M118 Y axis homed

[gcode_macro _HOME_Z]
gcode:
  {% set previous_bed_mesh_profile = printer.bed_mesh.profile_name|default("") %}
  {% set saved_bed_mesh_profiles = printer.bed_mesh.profiles|default([]) %}
  {% set restore_bed_mesh_profile = previous_bed_mesh_profile if previous_bed_mesh_profile in saved_bed_mesh_profiles else "" %}
  G90
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  {% if 'z'|lower in printer.toolhead.homed_axes|lower %}
    M118 Going to Z max as we are homed and endstop is at the bottom, it is very probable below
    {% set feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %} # 75% of max_z_velocity
    G1 Z{printer.configfile.settings.stepper_z.position_max} F{feedrate}
  {% endif %}
  G28.999999 Z
  {% if restore_bed_mesh_profile != "" %}
    BED_MESH_PROFILE LOAD={restore_bed_mesh_profile}
    M118 Restored bed mesh profile: {restore_bed_mesh_profile}
  {% elif previous_bed_mesh_profile != "" %}
    M118 Bed mesh profile {previous_bed_mesh_profile} was active before Z homing but is not saved; not restoring
  {% endif %}
  M118 Z axis homed

[gcode_macro G28]
rename_existing: G28.999999
gcode:
  # Reset coordinate transforms before homing. Restore saved mesh after homing.
  {% set previous_bed_mesh_profile = printer.bed_mesh.profile_name|default("") %}
  {% set saved_bed_mesh_profiles = printer.bed_mesh.profiles|default([]) %}
  {% set restore_bed_mesh_profile = previous_bed_mesh_profile if previous_bed_mesh_profile in saved_bed_mesh_profiles else "" %}
  G90
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  {% set is_specific_axis_homed = false %}
  {% if params %}
    {% if "Z" in params %}
      _HOME_Z
      {% set is_specific_axis_homed = true %}
    {% endif %}
    {% if "Y" in params %}
      SAFE_Z_CHECK
      _HOME_Y
      {% set is_specific_axis_homed = true %}
    {% endif %}
    {% if "X" in params %}
      SAFE_Z_CHECK
      _SENSORLESS_HOME_X
      {% set is_specific_axis_homed = true %}
    {% endif %}
  {% endif %}
  {% if not is_specific_axis_homed %}
    _HOME_Z
    SAFE_Z_CHECK
    _HOME_Y
    _SENSORLESS_HOME_X
  {% endif %}

  _APPLY_ACTIVE_TOOL_OFFSETS

  {% if restore_bed_mesh_profile != "" %}
    BED_MESH_PROFILE LOAD={restore_bed_mesh_profile}
    M118 Restored bed mesh profile: {restore_bed_mesh_profile}
  {% elif previous_bed_mesh_profile != "" %}
    M118 Bed mesh profile {previous_bed_mesh_profile} was active before homing but is not saved; not restoring
  {% endif %}
  M118 Done homing sequence
