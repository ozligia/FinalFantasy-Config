[bed_mesh]
horizontal_move_z: 1.00
speed: 200
mesh_min: 20, -15  
mesh_max: 290, 234 
probe_count: 10, 10
algorithm: bicubic
scan_overshoot: 5
zero_reference_position: 154,122
fade_start: 0.2
fade_end: 2
fade_target: 0.0

[gcode_macro MANUAL_BED_LEVEL]
description: Open manual bed leveling position UI
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Manual bed leveling"
  RESPOND TYPE=command MSG="action:prompt_text Move toolhead to a bed leveling point. XY axes must be homed."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button P1|_MANUAL_BED_LEVEL_MOVE POINT=1 X=7 Y=249|primary"
  RESPOND TYPE=command MSG="action:prompt_button P2|_MANUAL_BED_LEVEL_MOVE POINT=2 X=154 Y=249|primary"
  RESPOND TYPE=command MSG="action:prompt_button P3|_MANUAL_BED_LEVEL_MOVE POINT=3 X=304 Y=249|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button P4|_MANUAL_BED_LEVEL_MOVE POINT=4 X=7 Y=122|primary"
  RESPOND TYPE=command MSG="action:prompt_button P5|_MANUAL_BED_LEVEL_MOVE POINT=5 X=154 Y=122|primary"
  RESPOND TYPE=command MSG="action:prompt_button P6|_MANUAL_BED_LEVEL_MOVE POINT=6 X=304 Y=122|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button P7|_MANUAL_BED_LEVEL_MOVE POINT=7 X=7 Y=17|primary"
  RESPOND TYPE=command MSG="action:prompt_button P8|_MANUAL_BED_LEVEL_MOVE POINT=8 X=154 Y=17|primary"
  RESPOND TYPE=command MSG="action:prompt_button P9|_MANUAL_BED_LEVEL_MOVE POINT=9 X=304 Y=17|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _MANUAL_BED_LEVEL_MOVE]
description: Internal helper for manual bed leveling positions
gcode:
  {% if "X" not in params or "Y" not in params %}
    { action_raise_error("X and Y parameters are required") }
  {% endif %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    { action_raise_error("Home X and Y before manual bed leveling moves") }
  {% endif %}
  {% set point = params.POINT|default("?") %}
  {% set x = params.X|float %}
  {% set y = params.Y|float %}
  {% set feedrate = params.FEEDRATE|default(3000)|float %}
  M118 Manual bed leveling: move to P{point} X{x} Y{y}
  SAFE_Z_CHECK
  G1 X{x} Y{y} F{feedrate}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}  
  {% if "profile"|upper in params %}
    _BED_MESH_CALIBRATE PROFILE={params.PROFILE} METHOD=rapid_scan
  {% else %}
    _BED_MESH_CALIBRATE METHOD=rapid_scan
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE_AUTO]
description: Confirm and run automatic rapid bed mesh calibration
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Automatic bed mesh calibration"
  RESPOND TYPE=command MSG="action:prompt_text This will run a rapid bed mesh scan over the configured mesh area."
  RESPOND TYPE=command MSG="action:prompt_text If the printer is not fully homed, it will home all axes first."
  RESPOND TYPE=command MSG="action:prompt_text Keep the bed clear. The toolhead/probe will move across the bed and the active mesh will be replaced."
  RESPOND TYPE=command MSG="action:prompt_text This does not run SAVE_CONFIG; save the mesh manually if you want it persisted."
  RESPOND TYPE=command MSG="action:prompt_footer_button OK|_BED_MESH_CALIBRATE_AUTO_RUN {rawparams}|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_BED_MESH_CALIBRATE_AUTO_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _BED_MESH_CALIBRATE_AUTO_RUN]
description: Internal helper for confirmed automatic bed mesh calibration
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "profile"|upper in params %}
    BED_MESH_CALIBRATE PROFILE={params.PROFILE} METHOD=rapid_scan
  {% else %}
    BED_MESH_CALIBRATE METHOD=rapid_scan
  {% endif %}

[gcode_macro _BED_MESH_CALIBRATE_AUTO_CANCEL]
description: Internal helper for cancelled automatic bed mesh calibration
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=echo MSG="Automatic bed mesh calibration cancelled"

[gcode_macro BED_MESH_CALIBRATE_TEMP_PROFILES]
description: Capture rapid-scan bed meshes across bed temperature steps
gcode:
  {% set start = params.START|default(30)|int %}
  {% set end = params.END|default(params.MAX|default(110))|int %}
  {% set step = params.STEP|default(10)|int %}
  {% set soak_seconds = params.SOAK|default(120)|int %}
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %} # 75% of max_z_velocity
  {% set z_park = printer.configfile.settings.stepper_z.position_max|float %}
  {% if step <= 0 %}
    { action_raise_error("STEP must be greater than 0") }
  {% endif %}
  {% if start > end %}
    { action_raise_error("START must be less than or equal to END") }
  {% endif %}
  {% if soak_seconds < 0 %}
    { action_raise_error("SOAK must be zero or greater") }
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT=7200
  M118 Starting bed mesh temperature profile capture: {start}°C to {end}°C every {step}°C, soak {soak_seconds}s

  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if params.CLEAR_OFFSETS|default(0)|int %}
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  {% endif %}

  {% for temp in range(start, end + 1, step) %}
    M118 Heating bed to {temp}°C
    M190 S{temp}
    M118 Bed reached {temp}°C; Allowing heat to soak for {soak_seconds} seconds
    G4 P{soak_seconds * 1000}
    M118 Capturing rapid bed mesh profile bed_mesh_temp_{temp}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=bed_mesh_temp_{temp} METHOD=rapid_scan
    G1 Z50 F{z_feedrate}
  {% endfor %}
  M118 Parking Z at {z_park} before SAVE_CONFIG so the bed is supported when steppers de-energize.
  G90
  SET_GCODE_OFFSET Z=0.0
  G1 Z{z_park} F{z_feedrate}
  M140 S0
  M118 Saving bed mesh temperature profiles. Klipper will restart after SAVE_CONFIG.
  SAVE_CONFIG

[gcode_macro EDDY_CALIBRATION]
description: Dialog-driven calibration flow for the dedicated BTT Eddy probe toolhead
variable_tool: 5
variable_x: 154.0
variable_y: 122.0
variable_drive_z: 20.0
variable_height_z: 5.0
variable_tap_z: 15.0
variable_tap_speed: 7.0
variable_drift_target: 80.0
variable_drift_step: 2.0
variable_idle_timeout: 7200
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  {% set next_stage = printer.save_variables.variables.eddy_calibration_next|default("") %}
  {% if printer.print_stats.state|lower == "printing" %}
    { action_raise_error("Eddy probe calibration is blocked while printing") }
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy probe calibration"
  RESPOND TYPE=command MSG="action:prompt_text This maintenance flow is only for the dedicated BTT Eddy probe toolhead T{cfg.tool|int}, which must be mounted manually before any run step."
  RESPOND TYPE=command MSG="action:prompt_text It homes with the normal machine Z endstop only if needed, clears transient mesh/offset state, and moves to X{cfg.x|round(2)} Y{cfg.y|round(2)}. It does not perform a toolchange."
  RESPOND TYPE=command MSG="action:prompt_text Use Save/restart after Klipper reports a calibration stage is complete."
  {% if next_stage != "" %}
    RESPOND TYPE=command MSG="action:prompt_text Saved next stage after restart: {next_stage}."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Prepare - T{cfg.tool|int} mounted|_EDDY_CALIBRATION_PREP|primary"
  RESPOND TYPE=command MSG="action:prompt_button Drive current|_EDDY_CALIBRATION_DRIVE_CURRENT_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Height map|_EDDY_CALIBRATION_HEIGHT_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Tap threshold|_EDDY_CALIBRATION_TAP_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Thermal drift|_EDDY_CALIBRATION_DRIFT_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Temp mesh profiles|_EDDY_CALIBRATION_MESH_PROFILES_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% if next_stage != "" %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume {next_stage}|_EDDY_CALIBRATION_RESUME|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Save/restart|_EDDY_CALIBRATION_SAVE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Clear state|_EDDY_CALIBRATION_CLEAR_STATE|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_CANCEL]
description: Close the eddy calibration dialog
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=echo MSG="Eddy probe calibration cancelled"

[gcode_macro _EDDY_CALIBRATION_CLEAR_STATE]
description: Clear the saved eddy calibration resume stage
gcode:
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='""'
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=echo MSG="Eddy probe calibration resume state cleared"

[gcode_macro _EDDY_CALIBRATION_RESUME]
description: Resume the next saved eddy calibration stage
gcode:
  {% set next_stage = printer.save_variables.variables.eddy_calibration_next|default("") %}
  {% if next_stage == "height" %}
    _EDDY_CALIBRATION_HEIGHT_PROMPT
  {% elif next_stage == "tap" %}
    _EDDY_CALIBRATION_TAP_PROMPT
  {% elif next_stage == "drift" %}
    _EDDY_CALIBRATION_DRIFT_PROMPT
  {% elif next_stage == "mesh" %}
    _EDDY_CALIBRATION_MESH_PROFILES_PROMPT
  {% else %}
    EDDY_CALIBRATION
  {% endif %}

[gcode_macro _EDDY_CALIBRATION_PREP]
description: Home with the manually mounted eddy probe toolhead and move to the calibration point
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  {% set target_z = params.Z|default(cfg.drive_z)|float %}
  {% set center_sensor = params.CENTER_SENSOR|default(0)|int %}
  {% set xy_feedrate = printer.configfile.settings.printer.max_velocity * 60 * 0.60 %}
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
  {% set z_limit = [printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float - 0.5, printer.configfile.settings.stepper_z.position_max|float - 0.5]|min %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy_current_probe"] %}
  {% set probe_x_offset = probe_cfg.x_offset|default(0.0)|float %}
  {% set probe_y_offset = probe_cfg.y_offset|default(0.0)|float %}
  {% set x = cfg.x|float - (probe_x_offset if center_sensor else 0.0) %}
  {% set y = cfg.y|float - (probe_y_offset if center_sensor else 0.0) %}
  {% if printer.print_stats.state|lower == "printing" %}
    { action_raise_error("Eddy probe calibration is blocked while printing") }
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_IDLE_TIMEOUT TIMEOUT={cfg.idle_timeout|int}
  G90
  BED_MESH_CLEAR
  SET_SKEW CLEAR=1
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  G1 Z{z_limit} F{z_feedrate}
  G1 X{x} Y{y} F{xy_feedrate}
  G1 Z{target_z} F{z_feedrate}
  M118 Eddy calibration ready with manually mounted T{cfg.tool|int} at X{x|round(2)} Y{y|round(2)} Z{target_z|round(2)}

[gcode_macro _EDDY_CALIBRATION_SAVE]
description: Park safely and save the current eddy calibration result
gcode:
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
  {% set z_limit = [printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float - 0.5, printer.configfile.settings.stepper_z.position_max|float - 0.5]|min %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "z" in printer.toolhead.homed_axes %}
    G90
    SET_GCODE_OFFSET Z=0.0
    G1 Z{z_limit} F{z_feedrate}
  {% endif %}
  M140 S0
  M118 Saving eddy probe calibration. Klipper will restart after SAVE_CONFIG.
  SAVE_CONFIG

[gcode_macro _EDDY_CALIBRATION_DRIVE_CURRENT_PROMPT]
description: Explain the eddy drive-current calibration step
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy drive current"
  RESPOND TYPE=command MSG="action:prompt_text Manually mount T{cfg.tool|int} before running. This homes if needed and places the Eddy sensor near X{cfg.x|round(2)} Y{cfg.y|round(2)} at Z{cfg.drive_z|round(2)}."
  RESPOND TYPE=command MSG="action:prompt_text Klipper will measure the LDC1612 drive current. When it completes, use Save/restart before continuing to height map calibration."
  RESPOND TYPE=command MSG="action:prompt_footer_button Run - T{cfg.tool|int} mounted|_EDDY_CALIBRATION_DRIVE_CURRENT|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|EDDY_CALIBRATION|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_DRIVE_CURRENT]
description: Run BTT Eddy drive-current calibration
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='"height"'
  _EDDY_CALIBRATION_PREP Z={cfg.drive_z} CENTER_SENSOR=1
  M118 Running Eddy drive-current calibration. Save/restart when it completes.
  LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy_current_probe

[gcode_macro _EDDY_CALIBRATION_HEIGHT_PROMPT]
description: Explain the eddy height/frequency calibration step
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy height map"
  RESPOND TYPE=command MSG="action:prompt_text Manually mount T{cfg.tool|int} before running. This moves to X{cfg.x|round(2)} Y{cfg.y|round(2)} Z{cfg.height_z|round(2)} and starts PROBE_EDDY_CURRENT_CALIBRATE."
  RESPOND TYPE=command MSG="action:prompt_text Complete the manual paper/reference step, then ACCEPT in Klipper. Use Save/restart when Klipper reports the calibration is complete."
  RESPOND TYPE=command MSG="action:prompt_footer_button Run - T{cfg.tool|int} mounted|_EDDY_CALIBRATION_HEIGHT|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|EDDY_CALIBRATION|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_HEIGHT]
description: Run BTT Eddy frequency-to-height calibration
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='"tap"'
  _EDDY_CALIBRATION_PREP Z={cfg.height_z}
  M118 Running Eddy height map calibration. Complete the manual step, ACCEPT, then Save/restart.
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy_current_probe

[gcode_macro _EDDY_CALIBRATION_TAP_PROMPT]
description: Explain the eddy tap-threshold calibration stage
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy tap threshold"
  RESPOND TYPE=command MSG="action:prompt_text Manually mount T{cfg.tool|int} before running."
  RESPOND TYPE=command MSG="action:prompt_text Tap calibration intentionally lowers the tool until bed contact is detected. Keep the bed clean and be ready to emergency stop if contact is not detected."
  RESPOND TYPE=command MSG="action:prompt_text This starts each tap from Z{cfg.tap_z|round(2)} at {cfg.tap_speed|round(2)} mm/s, then runs Guess, Refine, and Verify. Use Save/restart after Verify succeeds."
  RESPOND TYPE=command MSG="action:prompt_footer_button Run - T{cfg.tool|int} mounted|_EDDY_CALIBRATION_TAP|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|EDDY_CALIBRATION|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_TAP]
description: Run BTT Eddy tap-threshold calibration sequence
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='"tap"'
  _EDDY_CALIBRATION_PREP Z={cfg.tap_z}
  PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess PROBE_SPEED={cfg.tap_speed}
  G1 Z{cfg.tap_z} F{z_feedrate}
  PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=refine PROBE_SPEED={cfg.tap_speed}
  G1 Z{cfg.tap_z} F{z_feedrate}
  PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=verify PROBE_SPEED={cfg.tap_speed}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='"drift"'

[gcode_macro EDDY_TAP_MEASURE_Z]
description: Measure Z with the manually mounted eddy probe tap method
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  {% set xy_feedrate = printer.configfile.settings.printer.max_velocity * 60 * 0.60 %}
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
  {% if printer.print_stats.state|lower == "printing" %}
    { action_raise_error("Eddy tap Z measurement is blocked while printing") }
  {% endif %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X{cfg.x} Y{cfg.y} F{xy_feedrate}
  G1 Z{cfg.tap_z} F{z_feedrate}
  PROBE METHOD=tap PROBE_SPEED={cfg.tap_speed}

[gcode_macro _EDDY_CALIBRATION_DRIFT_PROMPT]
description: Explain the eddy thermal-drift calibration step
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy thermal drift"
  RESPOND TYPE=command MSG="action:prompt_text Manually mount T{cfg.tool|int} before running."
  RESPOND TYPE=command MSG="action:prompt_text Start this with the bed, probe, and surrounding hardware cold."
  RESPOND TYPE=command MSG="action:prompt_text Default target is probe coil {cfg.drift_target|round(1)}°C with {cfg.drift_step|round(1)}°C sample steps. The configured bed heating limit is handled by the temperature_probe section."
  RESPOND TYPE=command MSG="action:prompt_text Tap-assisted mode automates samples and should only be used after tap Verify succeeds."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Run tap-assisted|_EDDY_CALIBRATION_DRIFT METHOD=tap|primary"
  RESPOND TYPE=command MSG="action:prompt_button Run manual|_EDDY_CALIBRATION_DRIFT METHOD=manual|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|EDDY_CALIBRATION|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_DRIFT]
description: Run BTT Eddy thermal-drift calibration
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  {% set target = params.TARGET|default(cfg.drift_target)|float %}
  {% set step = params.STEP|default(cfg.drift_step)|float %}
  {% set method = params.METHOD|default("tap")|lower %}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='"mesh"'
  _EDDY_CALIBRATION_PREP Z={cfg.height_z}
  M118 Running Eddy thermal drift calibration to {target}°C with {step}°C steps
  {% if method == "tap" %}
    TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy_current_probe TARGET={target} STEP={step} MANUAL_METHOD=tap PROBE_SPEED={cfg.tap_speed}
  {% else %}
    TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy_current_probe TARGET={target} STEP={step}
  {% endif %}

[gcode_macro _EDDY_CALIBRATION_MESH_PROFILES_PROMPT]
description: Explain optional eddy temperature mesh profile capture
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Eddy temperature mesh profiles"
  RESPOND TYPE=command MSG="action:prompt_text Manually mount T{cfg.tool|int} before running. This optional step captures and saves rapid-scan bed mesh profiles across bed temperatures."
  RESPOND TYPE=command MSG="action:prompt_text It heats the bed through the configured range and runs SAVE_CONFIG at the end, which restarts Klipper."
  RESPOND TYPE=command MSG="action:prompt_footer_button Run|_EDDY_CALIBRATION_MESH_PROFILES|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|EDDY_CALIBRATION|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_EDDY_CALIBRATION_CANCEL|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _EDDY_CALIBRATION_MESH_PROFILES]
description: Run temperature mesh profile capture with the manually mounted eddy probe toolhead
gcode:
  {% set cfg = printer["gcode_macro EDDY_CALIBRATION"] %}
  SAVE_VARIABLE VARIABLE=eddy_calibration_next VALUE='""'
  _EDDY_CALIBRATION_PREP Z={cfg.height_z}
  BED_MESH_CALIBRATE_TEMP_PROFILES CLEAR_OFFSETS=1 {rawparams}
