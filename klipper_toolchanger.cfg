[gcode_macro _SAVE_CURRENT_TOOL]
gcode:
  {% if not "TOOL_INDEX" in params %}
     { action_raise_error("TOOL_INDEX parameter is not specified!") }
  {% else %}
    {% set tool_index = params.TOOL_INDEX|int %}
    #M118 { "Saving last mounted tool_index: %d"|format(tool_index) }
    SAVE_VARIABLE VARIABLE=last_mounted_tool_index VALUE={tool_index}
  {% endif %}

[gcode_macro _GET_SAVED_TOOL_INDEX]
variable_current_tool_index: -999
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if not "last_mounted_tool_index" in svv %}
    { action_raise_error("Cannot get last mounted tool_index!")}
  {% else %}
    {% set tool_index = svv.last_mounted_tool_index|int %}
    #M118 { "Last mounted tool_index: %d"|format(tool_index) }
    SET_GCODE_VARIABLE MACRO=_GET_SAVED_TOOL_INDEX VARIABLE=current_tool_index VALUE={tool_index}
  {% endif %}

[gcode_macro _TAKE_TOOL]
gcode:
  {% set toolchange_feedrate = 40*60 %}
  {% if not "TOOL_INDEX" in params %}
    { action_raise_error("TOOL_INDEX parameter is not specified!") }
  {% else %}
    G91
    {% set tool_index = params.TOOL_INDEX|int %}
    M118 Take tool {tool_index}
    {% if "moves_take" in printer["gcode_macro T" ~ tool_index] %}
      {% for move in printer["gcode_macro T" ~ tool_index].moves_take %}
        {% set cmd = "G1 "~move~" F"~toolchange_feedrate %}
        #M118 {cmd}
        {cmd}
      {% endfor %}
    {% else %}
      { action_respond_info("There is no moves_take in T"~tool_index) }
    {% endif %}
    G90
  {% endif %}
    
[gcode_macro _PUT_TOOL]
gcode:
  {% set toolchange_feedrate = 40*60 %}
  {% if not "TOOL_INDEX" in params %}
    { action_raise_error("TOOL_INDEX parameter is not specified!") }
  {% else %}
    G91
    {% set tool_index = params.TOOL_INDEX|int %}
    M118 Put tool {tool_index}
    {% if "moves_put" in printer["gcode_macro T" ~ tool_index] %}
      {% for move in printer["gcode_macro T" ~ tool_index].moves_put %}
        {% set cmd = "G1 "~move~" F"~toolchange_feedrate %}
        #M118 {cmd}
        {cmd}
      {% endfor %}
    {% else %}
      { action_respond_info("There is no moves_put in T"~tool_index) }
    {% endif %}
    G90
  {% endif %}

[gcode_macro _CHANGE_TOOL]
gcode:
  {% if not "TOOL_INDEX" in params %}
    { action_raise_error("TOOL_INDEX parameter is not specified!") }
  {% else %}
    {% set tool_index = params.TOOL_INDEX|int %}
    _GET_SAVED_TOOL_INDEX
    __CHANGE_TOOL_WITH_UPDATED_STATE TOOL_INDEX={tool_index}
  {% endif %}
    
[gcode_macro __CHANGE_TOOL_WITH_UPDATED_STATE]
gcode:
  {% set TOOLCHANGE_CUR = 1.400 %}
  {% set travel_speed = printer.configfile.settings.printer.max_velocity * 60 * 0.60 %}
  {% if not "TOOL_INDEX" in params %}
    { action_raise_error("TOOL_INDEX parameter is not specified!") }
  {% else %}
    G90
    {% set current_tool = printer["gcode_macro _GET_SAVED_TOOL_INDEX"].current_tool_index|int %}
    {% set target_tool = params.TOOL_INDEX|int %}

    {% set part_cooling_fan_name = "part_cooling_fan_toolhead_" %}
    {% set current_tool_part_cooling_state = 0 %}
    {% if current_tool >= 0 and "fan_generic "~part_cooling_fan_name~current_tool in printer.configfile.settings %}
      {% set current_tool_part_cooling_state = printer["fan_generic "~part_cooling_fan_name~current_tool].speed|float %}
    {% endif %}
    
    # Perform tool changes if really needed
    {% if current_tool != target_tool %}
      M118 { "Request to exchange tool%d to tool%d"|format(current_tool, target_tool) }
      {% if current_tool != -1 %}
        {% set current_extruder = ("extruder"~current_tool)|replace("0","") %}
        {% if current_extruder in printer.heaters.available_heaters %}
          _PARK_FILAMENT_TIP EXTRUDER={current_extruder}
        {% endif %}
      {% endif %}
      _TOOL_CHANGE_Z_HOP
      {% if current_tool != -1 %} # Put current tool if mounted
        #M118 Go to { printer["gcode_macro T"~current_tool].approach_position }
        G1 { printer["gcode_macro T"~current_tool].entry_position} F{travel_speed}
        G1 { printer["gcode_macro T"~current_tool].approach_position} F{travel_speed}
        _SET_TMC_DRIVER_XY_CURRENT CURRENT={TOOLCHANGE_CUR}
        _PUT_TOOL TOOL_INDEX={current_tool}
        _SAVE_CURRENT_TOOL TOOL_INDEX=-1
        _SET_TMC_DRIVER_XY_CURRENT
        {% if "fan_generic "~part_cooling_fan_name~current_tool in printer.configfile.settings %}
          SET_FAN_SPEED FAN={part_cooling_fan_name~current_tool} SPEED=0
        {% endif %}
      {% endif %}
      G1 { printer["gcode_macro T"~target_tool].approach_position} F{travel_speed}
      _SET_TMC_DRIVER_XY_CURRENT CURRENT={TOOLCHANGE_CUR}
      _TAKE_TOOL TOOL_INDEX={target_tool}
      _SAVE_CURRENT_TOOL TOOL_INDEX={target_tool}
      _SET_TMC_DRIVER_XY_CURRENT
      {% if "fan_generic "~part_cooling_fan_name~target_tool in printer.configfile.settings %}
        SET_FAN_SPEED FAN={part_cooling_fan_name~target_tool} SPEED={current_tool_part_cooling_state}
      {% endif %}
      G1 { printer["gcode_macro T"~target_tool].entry_position} F{travel_speed}
      ACTIVATE_EXTRUDER EXTRUDER={"extruder"~target_tool|replace("0","")}
  _PRIME_NOZZLE
      CLEAN_NOZZLE
    {% endif %}
  {% endif %}

[gcode_macro _TOOL_CHANGE_Z_HOP]
variable_safe_z_hop: 2.0    # Minimum safe Z before moving
gcode:
  {% if "z" in printer.toolhead.homed_axes %}
    {% set z_hop_feedrate = printer.configfile.settings.printer.max_z_velocity*60|float %}
    {% set safe_z_hop = printer["gcode_macro _TOOL_CHANGE_Z_HOP"].safe_z_hop|default(2.0)|float %}
    {% set gcode_z = printer.gcode_move.gcode_position.z|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float - 0.5 %}
    {% set target_z = [gcode_z + safe_z_hop, z_limit]|min %}
    G90
    {% if target_z > gcode_z %}
      G1 Z{target_z} F{z_hop_feedrate}
    {% endif %}
  {% endif %}

[gcode_macro TEST_TAKE_PUT]
gcode:
  _GET_SAVED_TOOL_INDEX
  _TEST_TAKE_PUT
  
[gcode_macro _TEST_TAKE_PUT]
gcode:
  {% set TOOLCHANGE_CUR = 1.000 %}
  {% set travel_speed = printer.configfile.settings.printer.max_velocity*60*0.75 %}
  G90
  {% set current_tool = printer["gcode_macro _GET_SAVED_TOOL_INDEX"].current_tool_index|int %}
  {% set target_tool = current_tool %}
  M118 { "Request to exchange tool%d to tool%d"|format(current_tool, target_tool) }
  # Start z-hop before changing moves
  _TOOL_CHANGE_Z_HOP PHASE=START
  {% if current_tool != -1 %}
    #M118 Go to { printer["gcode_macro T"~current_tool].approach_position }
    G1 { printer["gcode_macro T"~current_tool].approach_position} F{travel_speed}
    _SET_TMC_DRIVER_XY_CURRENT CURRENT={TOOLCHANGE_CUR}
    _PUT_TOOL TOOL_INDEX={current_tool}
    _SAVE_CURRENT_TOOL TOOL_INDEX=-1
    _SET_TMC_DRIVER_XY_CURRENT
  {% endif %}
  G1 { printer["gcode_macro T"~target_tool].approach_position} F{travel_speed}
  _SET_TMC_DRIVER_XY_CURRENT CURRENT={TOOLCHANGE_CUR}
  _TAKE_TOOL TOOL_INDEX={target_tool}
  _SAVE_CURRENT_TOOL TOOL_INDEX={target_tool}
  _SET_TMC_DRIVER_XY_CURRENT

[gcode_macro TEST_TAKE_PUT_RELIABILITY]
gcode:
  {% set iterations = 100%}
  {% for i in range(iterations) %}
  TEST_TAKE_PUT
  M118 Testing take and put reliability, iteration: {i}/{iterations}
  {% endfor %}

[gcode_macro PUT_CURRENT_TOOL]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set tool_index = svv.last_mounted_tool_index|default(-1)|int %}
  {% if tool_index < 0 %}
    { action_raise_error("No mounted tool is saved; PUT_CURRENT_TOOL has nothing to put") }
  {% endif %}
  _PUT_TOOL TOOL_INDEX={tool_index}

[gcode_macro _TBASE]
gcode:
  {% set index = params.INDEX|int %}
  {% set travel_speed = printer.configfile.settings.printer.max_velocity * 60 * 0.60 %}
  {% set svv = printer.save_variables.variables %}
  {% set current_tool = svv.last_mounted_tool_index|default(-1)|int %}
  {% if current_tool != index %}
    _APPLY_BASE_OFFSET
    SAVE_GCODE_STATE NAME=tool_change
    _CHANGE_TOOL TOOL_INDEX={index}
    RESTORE_GCODE_STATE NAME=tool_change
  {% endif %}
  {% set target_extruder = ("extruder"~index)|replace("0","") %}
  {% if target_extruder in printer.heaters.available_heaters %}
    ACTIVATE_EXTRUDER EXTRUDER={target_extruder}
  {% endif %}
  _APPLY_TOOL_OFFSETS INDEX={index}
  
    
[gcode_macro T0]
# Entry position - point from where carriage with newly mounted tool can enter or dispatch tool changing zone
# without hitting anything
variable_entry_position: "X19.70 Y15.00"
# Approah position selected with assumption that there is always one tool in vicinity aligned in X axis
# either carriage is empty and tool sits in tool post, or carriage has the tool and tool post is empty
# That is why we can go closer to tool post on Y, than during printing, where carraige with the tool can
# pass by a tool post with tool. Approach position must be aligned on X axis with tool post
variable_approach_position: "X19.70 Y-25.00" 
variable_moves_put: ["Y-48.0","X15.0","Y48.0"]
variable_moves_take: ["X15.00","Y-48.0","X-15.00","Y48.0"]
variable_nozzle_offset_adjustment: "X_ADJUST=0.00 Y_ADJUST=0.00 Z_ADJUST=0.00" # Tool0 always has zero adjustments, as it is reference
# Tool 0 is reference. Tool 0 always has adjustment as X_ADJUST=0.00 Y_ADJUST=0.00 Z_ADJUST=0.00
gcode:
  _TBASE INDEX=0
  	
[gcode_macro T1]
# Entry position - point from where to enter tool changing logic
# Safe approach point, from any position in printer, even with tool mounted on a carriage
variable_entry_position: "X290.00 Y15.00"
# Approah position selected with assumption that there is always one tool in vicinity
# either carriage is empty and tool sits in tool post, or carriage has the tool and tool post is empty
# That is why we can go closer to tool post on Y, than during printing, where carraige with the tool can
# pass by a tool post with tool. Approach position must be aligned on X axis with tool post
variable_approach_position: "X290.00 Y-25.00"
variable_moves_put:  ["Y-48.00","X15.00","Y48.00"]
variable_moves_take: ["X15.00","Y-48.00","X-15.00","Y48.00"]
variable_nozzle_offset_adjustment: "X_ADJUST=-0.40 Y_ADJUST=0.00 Z_ADJUST=0.35"
gcode:
  { action_raise_error("T1 is disabled: toolhead_1 is out of service") }
  
[gcode_macro T5]
# Entry position - point from where to enter tool changing logic
# Safe approach point, from any position in printer, even with tool mounted on a carriage
variable_entry_position: "X199.00 Y15.00"
# Approah position selected with assumption that there is always one tool in vicinity
# either carriage is empty and tool sits in tool post, or carriage has the tool and tool post is empty
# That is why we can go closer to tool post on Y, than during printing, where carraige with the tool can
# pass by a tool post with tool. Approach position must be aligned on X axis with tool post
variable_approach_position: "X199.00 Y-25.00"
variable_moves_put:  ["Y-54.00","X15.00","Y54.00"]
variable_moves_take: ["X15.00","Y-54.00","X-15.00","Y54.00"]
variable_nozzle_offset_adjustment: "X_ADJUST=0.00 Y_ADJUST=0.00 Z_ADJUST=0.00"
gcode:
  _TBASE INDEX=5
