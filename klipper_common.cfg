[gcode_shell_command MACRO_LOG_APPEND]
command: /home/orangepi/printer_data/config/scripts/macro_log.sh
timeout: 2.
verbose: False

[gcode_macro LOG]
description: Append a line to a host log file
gcode:
  {% set msg = params.MSG|default(rawparams)|string %}
  RUN_SHELL_COMMAND CMD=MACRO_LOG_APPEND PARAMS="{msg}"

[delayed_gcode startup]
initial_duration: 2.0
gcode:
  M118 Startup...
  _STATE

[gcode_macro _STATE]
variable_tool_retracted_0: 0
variable_tool_retracted_1: 0
variable_tool_retracted_2: 0
variable_tool_retracted_3: 0
gcode:
  {% set saved_variables = printer.save_variables.variables %}
  {% set tool_count = 4 %}
  {% for i in range(tool_count) %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE={"tool_retracted_"~i} VALUE={saved_variables["tool_retracted_"~i]}
  {% endfor %}
  {% set current_tool = saved_variables.last_mounted_tool_index|int %}
  {% set base_offset = saved_variables.saved_z_offset_base|float %}
  {% set z_endstop_position = printer.configfile.settings.stepper_z.position_endstop|float %}
  M118 Loaded Z base offset: {base_offset}
  M118 Z endstop position: {z_endstop_position}
  M118 Current tool index: {current_tool}
  
[gcode_macro _SET_TMC_DRIVER_XY_CURRENT]
gcode:
  {% if "CURRENT" in params %}
    {% set current = params.CURRENT|float %}
    M118 Set TMC XY drivers current to {current}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current}
  {% else %}
    {% set def_current_x = printer.configfile.settings['tmc5160 stepper_x'].run_current %}
    {% set def_current_y = printer.configfile.settings['tmc5160 stepper_y'].run_current %}
    M118 Set TMC XY drivers current to default: {def_current_x}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={def_current_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={def_current_y}
  {% endif %}

[gcode_macro SAFE_Z_CHECK]
variable_safe_z: 2.0   # Minimum safe Z before moving
gcode:
  {% if 'z'|lower in printer.toolhead.homed_axes|lower %}
    {% set feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
    {% set safe_z = printer['gcode_macro SAFE_Z_CHECK'].safe_z|float %}
    {% set gcode_z = printer.gcode_move.gcode_position.z|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float - 0.5 %}
    {% set target_z = [safe_z, z_limit]|min %}
    # Larger Z lowers the bed away from the nozzle. Use gcode position because
    # G1 Z commands are interpreted in the active gcode-offset coordinate system.
    {% if gcode_z < target_z %}
      SAVE_GCODE_STATE NAME=safe_z_check
      G90
      G1 Z{target_z} F{feedrate}
      RESTORE_GCODE_STATE NAME=safe_z_check
    {% endif %}
  {% endif %}
