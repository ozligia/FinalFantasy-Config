#########################################################
# Filament and nozzle management macroses
#########################################################


[gcode_macro _STRING_BREAK_MOVE]
description: Small wipe move after retract/filament park to break PETG/stringy ooze
variable_lift: 0.6
variable_distance: 18.0
variable_margin: 5.0
variable_xy_feedrate: 12000
variable_z_feedrate: 1500
gcode:
  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
    {% set cfg = printer["gcode_macro _STRING_BREAK_MOVE"] %}
    {% set lift = params.LIFT|default(cfg.lift)|float %}
    {% set distance = params.DISTANCE|default(cfg.distance)|float %}
    {% set margin = params.MARGIN|default(cfg.margin)|float %}
    {% set xy_feedrate = params.XY_FEEDRATE|default(cfg.xy_feedrate)|float %}
    {% set z_feedrate = params.Z_FEEDRATE|default(cfg.z_feedrate)|float %}
    {% set x = printer.gcode_move.gcode_position.x|float %}
    {% set z = printer.gcode_move.gcode_position.z|float %}
    {% set x_min = printer.configfile.settings.stepper_x.position_min|float + margin %}
    {% set x_max = printer.configfile.settings.stepper_x.position_max|float - margin %}
    {% set z_max = printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float - margin %}
    {% set target_x = x + distance if x + distance <= x_max else x - distance %}
    {% set target_x = [[target_x, x_min]|max, x_max]|min %}
    {% set target_z = [z + lift, z_max]|min %}
    SAVE_GCODE_STATE NAME=string_break_move
    G90
    {% if lift > 0.001 and target_z > z %}
      G1 Z{target_z} F{z_feedrate}
    {% endif %}
    {% if distance > 0.001 and target_x != x %}
      M118 String break move: X {x|round(2)} -> {target_x|round(2)}, Z {target_z|round(2)}
      G1 X{target_x} F{xy_feedrate}
    {% endif %}
    RESTORE_GCODE_STATE NAME=string_break_move
  {% else %}
    RESPOND TYPE=echo MSG="String break move skipped; axes are not homed"
  {% endif %}

[gcode_macro _PRIME_NOZZLE]
variable_extra_prime_percent: 0.15
gcode:
  M118 _PRIME_NOZZLE call
  {% if printer.print_stats.state|lower == "printing" %}
    {% set extruder = printer.toolhead.extruder %}
    {% set tool_index = extruder|replace("extruder","")|int %}
    {% set retracted_distance = printer['gcode_macro _STATE']['tool_retracted_'~tool_index] %}
    M118 Parked filament distance: {retracted_distance} for tool index {tool_index} 
    {% set prime_distance = retracted_distance %}
    {% if params.EXTRA_DISTANCE %}
      {% set prime_distance = prime_distance * (1 + printer['gcode_macro _PRIME_NOZZLE'].extra_prime_percent) %}
    {% endif %}
    {% set feedrate = 50*60 %}
    {% set extruder = printer.toolhead.extruder %}
    {% set temp = printer[extruder].temperature|float %}
    {% set threshold = printer.configfile.settings[extruder].min_extrude_temp|float %}
    {% if temp > threshold %}
      M118 Prime nozzle: distance: {prime_distance} speed: {feedrate} tool_index: {tool_index}
      G91
      G1 E{prime_distance} F{feedrate}
      G90
      SET_GCODE_VARIABLE MACRO=_STATE VARIABLE={"tool_retracted_"~tool_index} VALUE={retracted_distance-prime_distance if retracted_distance > prime_distance else 0}
      SAVE_VARIABLE VARIABLE={"tool_retracted_"~tool_index} VALUE={retracted_distance-prime_distance if retracted_distance > prime_distance else 0}
    {% endif %}
  {% endif %}

[gcode_macro _PARK_FILAMENT_TIP]
description: Internal helper for persistent filament parking before tool park/stop/cancel
variable_park_distance: 8.0
variable_relief_distance: 1.0
variable_shape_push_distance: 0.35
variable_relief_feedrate: 3000
variable_shape_push_feedrate: 600
variable_final_feedrate: 1800
variable_dwell_ms: 120
gcode:
  {% set extruder = params.EXTRUDER|default(printer.toolhead.extruder) %}
  {% if extruder == "" %}
    RESPOND TYPE=echo MSG="Filament tip park skipped; no active extruder"
  {% elif extruder not in printer.heaters.available_heaters %}
    { action_raise_error("Filament tip park unknown EXTRUDER=%s" % extruder) }
  {% else %}
    {% set tool_index = extruder|lower|replace("extruder","")|int %}
    {% set configured_distance = printer["gcode_macro _PARK_FILAMENT_TIP"].park_distance|float %}
    {% set requested_distance = params.DISTANCE|default(configured_distance)|float %}
    {% set park_distance = [[requested_distance, 0.0]|max, configured_distance]|min %}
    {% set retracted_distance = printer["gcode_macro _STATE"]["tool_retracted_"~tool_index]|default(0)|float %}
    {% set temp = printer[extruder].temperature|float %}
    {% set threshold = printer.configfile.settings[extruder].min_extrude_temp|float %}
    {% if temp <= threshold %}
      RESPOND TYPE=echo MSG="Filament tip park skipped for {extruder}; temperature {temp|round(1)}°C is below min_extrude_temp {threshold|round(1)}°C"
    {% elif retracted_distance >= park_distance %}
      RESPOND TYPE=echo MSG="Filament tip already parked for {extruder}: {retracted_distance|round(2)}mm"
    {% elif park_distance <= 0 %}
      RESPOND TYPE=echo MSG="Filament tip park skipped for {extruder}; distance is zero"
    {% else %}
      {% set additional_distance = park_distance - retracted_distance %}
      {% set relief_requested = params.RELIEF_DISTANCE|default(printer["gcode_macro _PARK_FILAMENT_TIP"].relief_distance)|float %}
      {% set shape_push_requested = params.SHAPE_PUSH_DISTANCE|default(printer["gcode_macro _PARK_FILAMENT_TIP"].shape_push_distance)|float %}
      {% set relief_distance = [[relief_requested, 0.0]|max, additional_distance]|min %}
      {% set shape_push_distance = [[shape_push_requested, 0.0]|max, relief_distance]|min %}
      {% set final_distance = additional_distance - relief_distance + shape_push_distance %}
      {% set relief_feedrate = params.RELIEF_FEEDRATE|default(printer["gcode_macro _PARK_FILAMENT_TIP"].relief_feedrate)|float %}
      {% set shape_push_feedrate = params.SHAPE_PUSH_FEEDRATE|default(printer["gcode_macro _PARK_FILAMENT_TIP"].shape_push_feedrate)|float %}
      {% set final_feedrate = params.FINAL_FEEDRATE|default(printer["gcode_macro _PARK_FILAMENT_TIP"].final_feedrate)|float %}
      {% set dwell_ms = params.DWELL_MS|default(printer["gcode_macro _PARK_FILAMENT_TIP"].dwell_ms)|int %}
      M118 Parking filament tip for {extruder}: target {park_distance|round(2)}mm from nozzle
      SAVE_GCODE_STATE NAME=park_filament_tip
      ACTIVATE_EXTRUDER EXTRUDER={extruder}
      G91
      {% if relief_distance > 0.001 %}
        G1 E-{relief_distance} F{relief_feedrate}
      {% endif %}
      {% if dwell_ms > 0 %}
        G4 P{dwell_ms}
      {% endif %}
      {% if shape_push_distance > 0.001 %}
        G1 E{shape_push_distance} F{shape_push_feedrate}
      {% endif %}
      {% if final_distance > 0.001 %}
        G1 E-{final_distance} F{final_feedrate}
      {% endif %}
      G90
      RESTORE_GCODE_STATE NAME=park_filament_tip
      SET_GCODE_VARIABLE MACRO=_STATE VARIABLE={"tool_retracted_"~tool_index} VALUE={park_distance}
      SAVE_VARIABLE VARIABLE={"tool_retracted_"~tool_index} VALUE={park_distance}
    {% endif %}
  {% endif %}

[gcode_macro _LOAD_FILAMENT_FRONTEND]
description: Load filament frontend for one selected extruder. Optional: TEMP, LENGTH, F
gcode:
  {% if "EXTRUDER" not in params %}
    {action_raise_error("Missing EXTRUDER=extruder / EXTRUDER=extruder1 ...")}
  {% endif %}

  {% set ex = params.EXTRUDER %}
  {% if ex not in printer.heaters.available_heaters %}
    { action_raise_error("Unknown extruder heater: %s" % ex) }
  {% endif %}
  {% set feedrate = params.F|default(600)|float %}
  {% set length = params.LENGTH|default(150)|float %}
  {% if feedrate <= 0 %}
    { action_raise_error("F must be greater than zero") }
  {% endif %}
  {% if length <= 0 %}
    { action_raise_error("LENGTH must be greater than zero") }
  {% endif %}
  {% set tool = "Tool0" if ex == "extruder"
            else ("Tool" ~ (ex|replace("extruder","")|int)) %}

  {% if "TEMP" not in params %}
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Select filament type for {tool} ({ex}):"
    RESPOND TYPE=command MSG="action:prompt_text LENGTH={length}mm FEEDRATE={feedrate}mm/min"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA (200°C)|_LOAD_FILAMENT_FRONTEND EXTRUDER={ex} TEMP=200 LENGTH={length} F={feedrate}|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG (240°C)|_LOAD_FILAMENT_FRONTEND EXTRUDER={ex} TEMP=240 LENGTH={length} F={feedrate}|primary"
    RESPOND TYPE=command MSG="action:prompt_button ABS/ASA (255°C)|_LOAD_FILAMENT_FRONTEND EXTRUDER={ex} TEMP=255 LENGTH={length} F={feedrate}|primary"
    RESPOND TYPE=command MSG="action:prompt_button PC (270°C)|_LOAD_FILAMENT_FRONTEND EXTRUDER={ex} TEMP=270 LENGTH={length} F={feedrate}|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _LOAD_FILAMENT EXTRUDER={ex} TEMP={params.TEMP} LENGTH={length} F={feedrate}
  {% endif %}

[gcode_macro _LOAD_FILAMENT]
description: Internal helper; requires EXTRUDER and TEMP. Optional: LENGTH, F(mm/min)
gcode:
  {% if "EXTRUDER" not in params %}
    {action_raise_error("EXTRUDER parameter is not specified!")}
  {% endif %}
  {% if "TEMP" not in params %}
    {action_raise_error("TEMP parameter is not specified!")}
  {% endif %}
  {% if params.EXTRUDER not in printer.heaters.available_heaters %}
    { action_raise_error("Unknown extruder heater: %s" % params.EXTRUDER) }
  {% endif %}

  {% set extrude_distance = params.LENGTH|default(150)|float %}
  {% set feedrate = params.F|default(600)|float %}
  {% set temp = params.TEMP|float %}
  {% set temp_overshoot = 5 %}
  {% set min_extrude = printer.configfile.settings[params.EXTRUDER].min_extrude_temp|float %}
  {% set max_move = printer.configfile.settings[params.EXTRUDER].max_extrude_only_distance|default(50)|float %}
  {% if extrude_distance <= 0 %}
    { action_raise_error("LENGTH must be greater than zero") }
  {% endif %}
  {% if feedrate <= 0 %}
    { action_raise_error("F must be greater than zero") }
  {% endif %}
  {% if max_move <= 0 %}
    { action_raise_error("max_extrude_only_distance must be greater than zero") }
  {% endif %}
  {% set full_moves = (extrude_distance // max_move)|int %}
  {% set remainder = extrude_distance - (full_moves * max_move) %}
  {% if temp < min_extrude %}
    { action_raise_error("Requested load temperature %.1f°C for %s is below min_extrude_temp %.1f°C" % (temp, params.EXTRUDER, min_extrude)) }
  {% endif %}

  SET_HEATER_TEMPERATURE HEATER={params.EXTRUDER} TARGET={temp + temp_overshoot}
  M118 Loading filament into {params.EXTRUDER} at temp {temp}°C, extruding {extrude_distance}mm
  TEMPERATURE_WAIT SENSOR={params.EXTRUDER} MINIMUM={temp}

  # Wait 10s before extrusion
  G4 P10000

  SAVE_GCODE_STATE NAME=load_filament
  ACTIVATE_EXTRUDER EXTRUDER={params.EXTRUDER}
  G91

  {% for _ in range(full_moves) %}
    G1 E{max_move} F{feedrate}
  {% endfor %}
  {% if remainder > 0.001 %}
    G1 E{remainder} F{feedrate}
  {% endif %}

  G90
  RESTORE_GCODE_STATE NAME=load_filament

  # Turn heater off after load (comment out if you want to keep it hot)
  SET_HEATER_TEMPERATURE HEATER={params.EXTRUDER} TARGET=0

[gcode_macro LOAD_FILAMENT]
description: Open load filament UI. Optional: EXTRUDER, LENGTH, F, TEMP
gcode:
  {% set extruder = params.EXTRUDER|default("") %}
  {% set length = params.LENGTH|default(120)|float %}
  {% set feedrate = params.F|default(600)|float %}
  {% if length <= 0 %}
    { action_raise_error("LENGTH must be greater than zero") }
  {% endif %}
  {% if feedrate <= 0 %}
    { action_raise_error("F must be greater than zero") }
  {% endif %}

  {% if extruder != "" %}
    _LOAD_FILAMENT_FRONTEND EXTRUDER={extruder} LENGTH={length} F={feedrate}{% if "TEMP" in params %} TEMP={params.TEMP|float}{% endif %}
  {% else %}
    {% set tool_indexes = [] %}
    {% for heater in printer.heaters.available_heaters %}
      {% if heater.startswith("extruder") %}
        {% set suffix = heater|replace("extruder","") %}
        {% set tool_index = 0 if suffix == "" else suffix|int %}
        {% set _ = tool_indexes.append(tool_index) %}
      {% endif %}
    {% endfor %}
    {% set tool_indexes = tool_indexes|sort %}
    {% if tool_indexes|length == 0 %}
      { action_raise_error("No defined extruder heaters found for LOAD_FILAMENT") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Select tool to load using the buttons below."
    RESPOND TYPE=command MSG="action:prompt_text LENGTH={length}mm FEEDRATE={feedrate}mm/min{% if "TEMP" in params %} TEMP={params.TEMP|float}°C{% else %} TEMP=select material on next screen{% endif %}"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for tool_index in tool_indexes %}
      {% set extruder = "extruder" if tool_index == 0 else "extruder"~tool_index %}
      {% set ns = namespace(cmd="LOAD_FILAMENT EXTRUDER="~extruder~" LENGTH="~length~" F="~feedrate) %}
      {% if "TEMP" in params %}
        {% set ns.cmd = ns.cmd~" TEMP="~(params.TEMP|float) %}
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button T{tool_index}|{ns.cmd}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _UNLOAD_FILAMENT]
description: Internal helper; requires EXTRUDER. Optional: LENGTH, FEEDRATE, TEMP
gcode:
  {% if "EXTRUDER" in params %}
    {% if params.EXTRUDER not in printer.heaters.available_heaters %}
      { action_raise_error("Unknown extruder heater: %s" % params.EXTRUDER) }
    {% endif %}
    {% set retract_distance = params.LENGTH|default(120)|float %}
    {% set feedrate = params.FEEDRATE|default(10*60)|float %}
    {% set max_move = printer.configfile.settings[params.EXTRUDER].max_extrude_only_distance|default(50)|float %}
    {% set tool_index = params.EXTRUDER|lower|replace("extruder","")|int %}
    {% set last_used_temp = printer.save_variables.variables['last_used_nozzle_temp'~tool_index]|default(200)|float %}
    {% set unload_temp = params.TEMP|float if "TEMP" in params else last_used_temp - 30 %}
    {% set temp_overshoot = 5 %}
    {% set min_extrude = printer.configfile.settings[params.EXTRUDER].min_extrude_temp|float %}
    {% if retract_distance <= 0 %}
      { action_raise_error("LENGTH must be greater than zero") }
    {% endif %}
    {% if max_move <= 0 %}
      { action_raise_error("max_extrude_only_distance must be greater than zero") }
    {% endif %}
    {% set full_moves = (retract_distance // max_move)|int %}
    {% set remainder = retract_distance - (full_moves * max_move) %}
    {% if unload_temp < min_extrude %}
      { action_raise_error("Computed unload temperature %.1f°C for %s is below min_extrude_temp %.1f°C; last used nozzle temperature is %.1f°C" % (unload_temp, params.EXTRUDER, min_extrude, last_used_temp)) }
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={params.EXTRUDER} TARGET={unload_temp + temp_overshoot} # Set for overshoot to heatup faster
    M118 Unloading filament from {params.EXTRUDER} at temp {unload_temp}°C by retracting for distance {retract_distance}
    TEMPERATURE_WAIT SENSOR={params.EXTRUDER} MINIMUM={unload_temp}
    SAVE_GCODE_STATE NAME=unload_filament
    ACTIVATE_EXTRUDER EXTRUDER={params.EXTRUDER}
    G91
    {% for _ in range(full_moves) %}
      G1 E-{max_move} F{feedrate}
    {% endfor %}
    {% if remainder > 0.001 %}
      G1 E-{remainder} F{feedrate}
    {% endif %}
    G90
    RESTORE_GCODE_STATE NAME=unload_filament
    SET_HEATER_TEMPERATURE HEATER={params.EXTRUDER} TARGET=0
  {% else %}
    M118 EXTRUDER parameter is not specified!
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Open unload filament UI. Optional: EXTRUDER, LENGTH, FEEDRATE, TEMP
gcode:
  {% set extruder = params.EXTRUDER|default("") %}
  {% set length = params.LENGTH|default(180)|float %}
  {% set feedrate = params.FEEDRATE|default(600)|float %}
  {% if length <= 0 %}
    { action_raise_error("LENGTH must be greater than zero") }
  {% endif %}
  {% if feedrate <= 0 %}
    { action_raise_error("FEEDRATE must be greater than zero") }
  {% endif %}

  {% if extruder != "" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _UNLOAD_FILAMENT EXTRUDER={extruder} LENGTH={length} FEEDRATE={feedrate}{% if "TEMP" in params %} TEMP={params.TEMP|float}{% endif %}
  {% else %}
    {% set tool_indexes = [] %}
    {% for heater in printer.heaters.available_heaters %}
      {% if heater.startswith("extruder") %}
        {% set suffix = heater|replace("extruder","") %}
        {% set tool_index = 0 if suffix == "" else suffix|int %}
        {% set _ = tool_indexes.append(tool_index) %}
      {% endif %}
    {% endfor %}
    {% set tool_indexes = tool_indexes|sort %}
    {% if tool_indexes|length == 0 %}
      { action_raise_error("No defined extruder heaters found for UNLOAD_FILAMENT") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
    RESPOND TYPE=command MSG="action:prompt_text Select tool to unload using the buttons below."
    RESPOND TYPE=command MSG="action:prompt_text LENGTH={length}mm FEEDRATE={feedrate}mm/min{% if "TEMP" in params %} TEMP={params.TEMP|float}°C{% else %} TEMP=last_used_nozzle_temp - 30°C{% endif %}"
    {% for tool_index in tool_indexes %}
      {% set last_used_temp = printer.save_variables.variables["last_used_nozzle_temp"~tool_index]|default(200)|float %}
      {% set unload_temp = params.TEMP|float if "TEMP" in params else last_used_temp - 30 %}
      RESPOND TYPE=command MSG="action:prompt_text T{tool_index}: unload at {unload_temp|round(0)|int}°C"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for tool_index in tool_indexes %}
      {% set extruder = "extruder" if tool_index == 0 else "extruder"~tool_index %}
      {% set ns = namespace(cmd="UNLOAD_FILAMENT EXTRUDER="~extruder~" LENGTH="~length~" FEEDRATE="~feedrate) %}
      {% if "TEMP" in params %}
        {% set ns.cmd = ns.cmd~" TEMP="~(params.TEMP|float) %}
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button T{tool_index}|{ns.cmd}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro CLEAN_NOZZLE]
variable_entry_position: "X108.00 Y15.00"
variable_approach_position: "X108 Y-25.00" 
variable_wipe_min_x: 108.0
variable_wipe_max_x: 116.0
variable_wipe_min_y: -70.0
variable_wipe_max_y: -65.0
gcode:
  {% if printer.print_stats.state|lower == "printing" %}
      {% set xy_feedrate = printer.configfile.settings.printer.max_velocity * 60 * 0.50 %}
      {% set wipe_min_x = printer["gcode_macro CLEAN_NOZZLE"].wipe_min_x|float %}
      {% set wipe_max_x = printer["gcode_macro CLEAN_NOZZLE"].wipe_max_x|float %}
      {% set wipe_min_y = printer["gcode_macro CLEAN_NOZZLE"].wipe_min_y|float %}
      {% set wipe_max_y = printer["gcode_macro CLEAN_NOZZLE"].wipe_max_y|float %}
      {% set wipe_width = wipe_max_x - wipe_min_x %}
      {% set wipe_height = wipe_max_y - wipe_min_y %}
      {% set repeats = params.REPEAT|default(params.N|default(1))|int %}
      {% if wipe_width <= 0 or wipe_height <= 0 %}
        { action_raise_error("CLEAN_NOZZLE wipe rectangle is invalid") }
      {% endif %}
      {% if repeats < 1 %}
        { action_raise_error("CLEAN_NOZZLE REPEAT must be at least 1") }
      {% endif %}
      {% set wipe_mid_y = (wipe_min_y + wipe_max_y) / 2 %}
      {% set spiral_radius = [2.0, wipe_width / 2, wipe_height / 2]|min %}
      {% set spiral_left = wipe_min_x + spiral_radius %}
      {% set spiral_right = wipe_max_x - spiral_radius %}
      {% set spiral_steps = 25 %}
      {% set spiral_offsets = [
        [1.0, 0.0],
        [0.7, 0.7],
        [0.0, 1.0],
        [-0.7, 0.7],
        [-1.0, 0.0],
        [-0.7, -0.7],
        [0.0, -1.0],
        [0.7, -0.7]
      ] %}
      {% if printer.toolhead.position.y > printer["gcode_macro CLEAN_NOZZLE"].entry_position.split("Y")[1]|float %}
        G1 {printer["gcode_macro CLEAN_NOZZLE"].entry_position} F{xy_feedrate}
      {% endif %}
      G1 {printer["gcode_macro CLEAN_NOZZLE"].approach_position} F{xy_feedrate}
      G90
      {% for repeat in range(repeats) %}
        G1 X{wipe_min_x} Y{wipe_min_y} F{xy_feedrate}
        {% for i in range(7) %}
          {% set x = wipe_min_x + (wipe_width * i / 7) %}
          G1 X{x} Y{wipe_max_y} F{xy_feedrate}
          G1 X{x} Y{wipe_min_y} F{xy_feedrate}
          G1 X{x + wipe_width / 7} Y{wipe_min_y} F{xy_feedrate}
        {% endfor %}
        G1 X{wipe_max_x} Y{wipe_max_y} F{xy_feedrate}
        {% for i in range(5) %}
          {% set y = wipe_max_y - (wipe_height * i / 5) %}
          G1 X{wipe_min_x} Y{y} F{xy_feedrate}
          G1 X{wipe_max_x} Y{y} F{xy_feedrate}
          G1 X{wipe_max_x} Y{y - wipe_height / 5} F{xy_feedrate}
        {% endfor %}
        G1 X{spiral_left + spiral_radius} Y{wipe_mid_y} F{xy_feedrate}
        {% for i in range(spiral_steps) %}
          {% set offset = spiral_offsets[i % (spiral_offsets|length)] %}
          {% set center_x = spiral_left + ((spiral_right - spiral_left) * i / (spiral_steps - 1)) %}
          {% set x = center_x + offset[0] * spiral_radius %}
          {% set y = wipe_mid_y + offset[1] * spiral_radius %}
          G1 X{x} Y{y} F{xy_feedrate}
        {% endfor %}
      {% endfor %}
      G1 {printer["gcode_macro CLEAN_NOZZLE"].entry_position} F{xy_feedrate}
  {% endif %}

[gcode_macro DRAW_PURGE_LINE]
gcode:
  {% set y_pos = params.Y|default((printer.toolhead.extruder|replace("extruder","")|float)*10+10)|float %}
  {% set xy_feedrate = printer.configfile.settings.printer.max_velocity * 60 * 0.50 %}
  {% set z_feedrate = printer.configfile.settings.printer.max_z_velocity * 60 * 0.75 %}
  {% set print_feedrate = 40*60 %}
  M118 Drawing purge line at Y position: {y_pos}

  {% set active_extruder_index = printer.toolhead.extruder.replace('extruder','')|int %}
  {% set nozzle_diameter = params.NOZZLE_DIAMETER|default(printer.save_variables.variables["last_used_nozzle_diameter"~active_extruder_index])|float %}
  {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(nozzle_diameter/2)|float %}
  {% set length = 260.0|float %}
  {% set segments_count = 3|int %}
  
  {% set filament_diameter = 1.75|float %}
  
  {% set pi = 3.14159 %}
  
  #M118 nozzle_diameter: {nozzle_diameter} first_layer_height: {first_layer_height} length: {length} filament_diameter: {filament_diameter}
  {% set vol_1 = nozzle_diameter * first_layer_height * length / segments_count %}
  {% set filament_area = (pi * filament_diameter * filament_diameter) / 4 %}
  {% set e_steps = vol_1 / filament_area  %}
  #M118 vol_1: {vol_1} filament_area: {filament_area} e_steps: {e_steps}
  
  G1 X10 Y{y_pos} F{xy_feedrate}
  G1 Z{first_layer_height} F{z_feedrate}

  M83
  G92 E0

  {% for i in range(segments_count) %}
    #M118 Purge line segment: {i+1} X: {10 + length/3 * (i+1) } Y: {y_pos} E: {e_steps * (segments_count - i)} F: {print_feedrate}
    G1 X{10 + length/3 * (i+1) } Y{y_pos} E{e_steps * (segments_count - i)} F{print_feedrate}
  {% endfor %}

[gcode_macro DRAW_PURGE_LINES]
description: Open frontend dialog for drawing purge lines with all defined extruders
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Draw purge lines"
  RESPOND TYPE=command MSG="action:prompt_text This will home the printer, turn part cooling fans off, heat each defined extruder tool one by one, prime it, draw one purge line, cool it down, and then run STOP_PRINT."
  RESPOND TYPE=command MSG="action:prompt_text Default purge temperature is 200°C for each tool unless TEMP0, TEMP1, and similar parameters are supplied."
  RESPOND TYPE=command MSG="action:prompt_footer_button Start|_DRAW_PURGE_LINES {rawparams}|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DRAW_PURGE_LINES]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set tool_indexes = [] %}
  {% for heater in printer.heaters.available_heaters %}
    {% if heater.startswith('extruder') %}
      {% set tool_index = heater|replace('extruder','') %}
      {% set tool_index = '0' if tool_index == '' else tool_index %}
      {% if 'gcode_macro T'~tool_index in printer %}
        {% set _ = tool_indexes.append(tool_index) %}
      {% else %}
        RESPOND TYPE=echo MSG="Skipping purge line for {heater}; T{tool_index} macro is not defined"
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if tool_indexes|length == 0 %}
    { action_raise_error("No defined extruder tools found for DRAW_PURGE_LINES") }
  {% endif %}

  {% set initial_tool_index = tool_indexes[0] %}
  {% set initial_tool_temp = params['TEMP'~initial_tool_index]|default(200)|float %}
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=tools_used VALUE='"{tool_indexes|join(",")}"'
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_index VALUE={initial_tool_index}
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=initial_tool_temp VALUE={initial_tool_temp}
  {% for i in range(4) %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~i} VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_idle_temp_"~i} VALUE=0.0
  {% endfor %}
  {% for tool_index in tool_indexes %}
    {% if tool_index|int < 4 %}
      {% set temp = params['TEMP'~tool_index]|default(200)|float %}
      SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE={"tool_temp_"~tool_index} VALUE={temp}
    {% endif %}
  {% endfor %}

  M107 ALL
  G28
  {% for tool_index in tool_indexes %}
    {% set temp = params['TEMP'~tool_index]|default(200)|float %}
    T{tool_index}
    M109 S{temp} T{tool_index}
    _PRIME_NOZZLE
    DRAW_PURGE_LINE
    M109 S0
  {% endfor %}
  STOP_PRINT
